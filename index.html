<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI議事録">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <title>北九州ITクラブ 音声解析リアルタイム議事録</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#1432AA', light: '#F0F4FF', dark: '#0A1D6B' }
                    },
                    typography: (theme) => ({
                        DEFAULT: {
                            css: {
                                h1: { color: theme('colors.brand.dark'), borderBottom: '2px solid', borderColor: theme('colors.brand.light'), paddingBottom: '0.5rem', fontSize: '24px', lineHeight: '1.3' },
                                h2: { color: theme('colors.brand.dark'), borderBottom: '2px solid', borderColor: theme('colors.gray.200'), paddingBottom: '0.5rem', marginTop: '1.5rem', fontSize: '18px', lineHeight: '1.4' },
                                h3: { color: theme('colors.brand.DEFAULT'), marginTop: '1.2rem', fontSize: '16px', lineHeight: '1.5' },
                                strong: { color: theme('colors.gray.900'), backgroundColor: theme('colors.brand.light'), padding: '0.1rem 0.3rem', borderRadius: '0.25rem' },
                                'ul > li::marker': { color: theme('colors.brand.DEFAULT') },
                                'ol > li::marker': { color: theme('colors.brand.DEFAULT'), fontWeight: 'bold' },
                                p: { fontSize: '14px' }, li: { fontSize: '14px' }
                            }
                        }
                    })
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <!-- altChunk方式ではなく、Google Docs互換のOOXMLを生成するDOCXライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js"></script>
    
    <!-- ★追加：スリープ防止ライブラリ (iOS Safariフォールバック用) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nosleep/0.12.0/NoSleep.min.js"></script>
    
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        body { -webkit-tap-highlight-color: transparent; }
        .recording-pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .tab-active { border-bottom: 2px solid #1432AA; color: #1432AA; font-weight: bold; }
        .tab-inactive { color: #6B7280; }
        @media (max-width: 1023px) { .mobile-hidden { display: none !important; } }
        
        /* 出力メニューのドロップダウン用スタイル */
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 50;
            border-radius: 0.5rem;
            border: 1px solid #e5e7eb;
            overflow: hidden;
        }
        .dropdown-content.show {
            display: block;
            animation: fadeIn 0.2s ease-in;
        }
        #summaryContent { overflow-wrap: anywhere; word-break: normal; }
        #summaryContent table { display: block; max-width: 100%; overflow-x: auto; white-space: nowrap; }
        #summaryContent pre { max-width: 100%; overflow-x: auto; white-space: pre-wrap; }
        #summaryContent img { max-width: 100%; height: auto; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col pt-safe">

    <!-- ヘッダー -->
    <header class="bg-white shadow-sm border-b border-gray-200 py-3 px-4 flex justify-between items-center sticky top-0 z-20">
        <div class="flex items-center gap-2">
            <div class="bg-brand text-white p-1.5 rounded-lg shadow-sm">
                <i data-lucide="mic-2" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-bold text-gray-900 leading-tight">AI議事録ツール</h1>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <button id="forceProcessBtn" title="今すぐ解析" class="hidden items-center justify-center bg-yellow-100 text-yellow-700 p-2 rounded-lg hover:bg-yellow-200 transition-colors border border-yellow-300 shadow-sm">
                <i data-lucide="zap" class="w-5 h-5"></i>
            </button>
            <label id="uploadLabelWrapper" class="cursor-pointer flex items-center justify-center bg-gray-100 text-gray-700 p-2 rounded-lg hover:bg-gray-200 transition-colors border border-gray-200 shadow-sm">
                <i data-lucide="upload" class="w-5 h-5"></i>
                <input type="file" id="audioFileInput" accept="audio/*" class="hidden">
            </label>
            <button id="settingsBtn" title="設定" class="flex items-center justify-center bg-gray-100 text-gray-700 p-2 rounded-lg hover:bg-gray-200 transition-colors border border-gray-200 shadow-sm">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
            <button id="recordBtn" class="flex items-center gap-1.5 bg-brand text-white px-3 sm:px-4 py-2 rounded-lg font-bold shadow-sm transition-colors">
                <i data-lucide="play" class="w-4 h-4" id="recordIcon"></i>
                <span id="recordText">開始</span>
            </button>
        </div>
    </header>

    <!-- プログレスバー -->
    <div id="progressContainer" class="w-full bg-gray-200 h-1 hidden">
        <div id="progressBar" class="bg-brand h-1 transition-all duration-1000 ease-linear" style="width: 0%"></div>
    </div>

    <!-- スマホ用タブ切り替え -->
    <div class="flex lg:hidden bg-white border-b border-gray-200 sticky z-10" style="top: 60px;">
        <button id="tabTranscript" class="flex-1 py-3 text-sm tab-active flex items-center justify-center gap-2">
            <i data-lucide="users" class="w-4 h-4"></i> 文字起こし
        </button>
        <button id="tabSummary" class="flex-1 py-3 text-sm tab-inactive flex items-center justify-center gap-2">
            <i data-lucide="file-text" class="w-4 h-4"></i> 議事録
        </button>
    </div>

    <!-- メインコンテンツ -->
    <main class="flex-1 w-full mx-auto p-2 sm:p-4 lg:p-6 flex flex-col lg:flex-row gap-4 lg:gap-6 h-[calc(100vh-140px)] max-w-screen-2xl">
        
        <!-- 左側：文字起こし履歴 -->
        <div id="panelTranscript" class="flex-1 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden h-full">
            <div class="bg-white px-3 sm:px-4 py-2 sm:py-3 border-b border-gray-200 flex justify-between items-center">
                <h2 class="font-semibold text-gray-700 flex items-center gap-2 text-sm sm:text-base hidden lg:flex">
                    <i data-lucide="users" class="w-4 h-4 text-gray-500"></i> 文字起こし (履歴)
                </h2>
                <div class="flex items-center gap-2 w-full lg:w-auto justify-between lg:justify-end">
                    <span id="statusIndicator" class="text-[10px] sm:text-xs font-medium bg-gray-100 text-gray-600 px-2 py-1 rounded-full whitespace-nowrap">待機中</span>
                    <button id="copyTranscriptBtn" class="flex items-center gap-1 text-[10px] sm:text-xs font-bold bg-white border border-gray-300 text-gray-600 px-2 sm:px-3 py-1 sm:py-1.5 rounded hover:bg-gray-100 shadow-sm">
                        <i data-lucide="copy" class="w-3 h-3"></i> コピー
                    </button>
                </div>
            </div>
            <div id="transcriptArea" class="flex-1 p-3 sm:p-4 overflow-y-auto space-y-3 sm:space-y-4 bg-gray-50/50">
                <p class="text-gray-400 italic text-xs sm:text-sm text-center mt-10" id="transcriptPlaceholder">
                    録音を開始すると、ここに文字起こしが追加されます。
                </p>
            </div>
        </div>

        <!-- 右側：全体議事録 -->
        <div id="panelSummary" class="flex-1 bg-white rounded-xl shadow-sm border border-brand/20 flex flex-col overflow-hidden h-full mobile-hidden">
            <div class="bg-brand-light px-3 sm:px-4 py-2 sm:py-3 border-b border-brand/20 flex justify-between items-center relative">
                <h2 class="font-semibold text-brand-dark flex items-center gap-2 text-sm sm:text-base hidden lg:flex">
                    <i data-lucide="file-text" class="w-4 h-4 text-brand"></i> 最新の全体議事録
                </h2>
                <div class="flex items-center gap-2 w-full lg:w-auto justify-between lg:justify-end">
                    <span id="processCount" class="text-[10px] sm:text-xs font-medium text-brand bg-brand/10 px-2 py-1 rounded">0回更新</span>
                    <div class="flex gap-1.5 relative">
                        <!-- 出力ドロップダウンボタン -->
                        <div class="relative inline-block text-left">
                            <button id="exportDropdownBtn" class="flex items-center gap-1 text-[10px] sm:text-xs font-bold bg-white border border-brand/30 text-brand px-2 sm:px-3 py-1 sm:py-1.5 rounded hover:bg-brand hover:text-white shadow-sm transition-colors">
                                <i data-lucide="share" class="w-3 h-3"></i> <span class="hidden sm:inline">ドキュメント出力</span><span class="sm:hidden">出力・共有</span>
                            </button>
                            <!-- ドロップダウンメニュー -->
                            <div id="exportMenu" class="dropdown-content mt-1">
                                <button id="exportDocxBtn" class="w-full text-left px-4 py-3 sm:py-2 text-xs sm:text-sm text-gray-700 hover:bg-gray-100 flex items-center gap-2 border-b border-gray-100">
                                    <i data-lucide="file-text" class="w-4 h-4 text-blue-600"></i> Word (.docx) 形式
                                </button>
                                <button id="exportTxtBtn" class="w-full text-left px-4 py-3 sm:py-2 text-xs sm:text-sm text-gray-700 hover:bg-gray-100 flex items-center gap-2">
                                    <i data-lucide="file-text" class="w-4 h-4 text-gray-600"></i> テキスト (.txt) 形式
                                </button>
                            </div>
                        </div>

                        <button id="copySummaryBtn" class="flex items-center gap-1 text-[10px] sm:text-xs font-bold bg-white border border-brand/30 text-brand px-2 sm:px-3 py-1 sm:py-1.5 rounded hover:bg-brand hover:text-white shadow-sm transition-colors">
                            <i data-lucide="copy" class="w-3 h-3"></i> コピー
                        </button>
                    </div>
                </div>
            </div>
            <div id="summaryArea" class="flex-1 p-3 sm:p-5 overflow-y-auto bg-white">
                <div id="summaryContent" class="prose max-w-none text-gray-800">
                    <p class="text-gray-400 italic text-xs sm:text-sm text-center mt-10" id="summaryPlaceholder">
                        音声の解析が進むと、最新の議事録がここに生成されます。
                    </p>
                </div>
            </div>
            
            <div id="loadingToast" class="absolute bottom-4 right-4 bg-gray-900 text-white px-3 py-2 rounded-lg shadow-lg flex items-center gap-2 transition-opacity opacity-0 pointer-events-none z-10 text-sm">
                <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-brand-light"></i>
                <span>議事録を更新中...</span>
            </div>
        </div>
    </main>

    <!-- 設定モーダル -->
    <div id="settingsModal" class="fixed inset-0 bg-gray-900/50 hidden flex items-center justify-center z-50 p-4 transition-opacity opacity-0 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto transform scale-95 transition-transform duration-200">
            <div class="flex justify-between items-center p-4 border-b border-gray-100 sticky top-0 bg-white/90 backdrop-blur">
                <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2"><i data-lucide="settings" class="w-5 h-5 text-gray-500"></i> 設定</h3>
                <button id="closeSettingsBtn" class="p-1 hover:bg-gray-100 rounded-full"><i data-lucide="x" class="w-5 h-5 text-gray-500"></i></button>
            </div>
            <div class="p-5 space-y-5">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Gemini APIキー <span class="text-red-500">*</span></label>
                    <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-brand focus:border-brand shadow-inner">
                    <div class="flex justify-between items-center mt-1.5 gap-2">
                        <p class="text-[10px] text-gray-500">このブラウザ内に保存され、次回から自動入力されます。</p>
                        <button id="clearApiKeyBtn" type="button" class="text-[10px] text-red-600 hover:underline whitespace-nowrap">保存キーを消去</button>
                    </div>
                </div>
                <div class="bg-brand-light/50 p-3 rounded-lg border border-brand/10 space-y-3">
                    <div>
                        <label class="block text-sm font-bold text-brand-dark mb-1">会議のテーマ・目的</label>
                        <input type="text" id="themeInput" placeholder="例: 新アプリ開発のキックオフ" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-brand focus:border-brand">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-brand-dark mb-1">参加者名 (カンマ区切り)</label>
                        <input type="text" id="participantsInput" placeholder="例: 山田, 佐藤, 鈴木" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-brand focus:border-brand">
                        <p class="text-[10px] text-gray-500 mt-1">※事前に入力するとAIの文字起こしや要約の精度が向上します。</p>
                    </div>
                    <button id="clearMeetingInfoBtn" type="button" class="w-full flex items-center justify-center gap-1.5 py-2 border border-gray-300 bg-white text-gray-600 rounded-lg hover:bg-red-50 hover:text-red-600 hover:border-red-200 transition-colors text-xs font-bold">
                        <i data-lucide="eraser" class="w-3.5 h-3.5"></i> 記憶したテーマ・参加者を消去
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">録音モード</label>
                        <select id="modeSelect" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
                            <option value="mic">対面会議 (マイク)</option>
                            <option value="mix">オンライン会議</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">解析周期</label>
                        <select id="intervalSelect" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
                            <option value="60">1分</option>
                            <option value="300" selected>5分 (推奨)</option>
                            <option value="600">10分</option>
                        </select>
                    </div>
                </div>
                <hr class="border-gray-100">
                <div>
                    <button id="modalResetBtn" class="w-full flex justify-center items-center gap-2 py-2.5 border border-red-200 text-red-600 bg-red-50 rounded-lg hover:bg-red-100 transition-colors text-sm font-bold shadow-sm">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> これまでのデータを消去してリセット
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- マイク利用不可の案内 -->
    <div id="micHelpModal" class="fixed inset-0 bg-gray-900/50 hidden flex items-center justify-center z-[70] p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden">
            <div class="flex justify-between items-center p-4 border-b border-gray-100">
                <h3 class="text-lg font-bold text-red-700 flex items-center gap-2"><i data-lucide="mic-off" class="w-5 h-5"></i> マイクを利用できません</h3>
                <button id="closeMicHelpBtn" type="button" class="p-1 hover:bg-gray-100 rounded-full"><i data-lucide="x" class="w-5 h-5 text-gray-500"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <div id="micHelpMessage" class="text-sm text-gray-700 leading-relaxed"></div>
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 text-xs text-blue-900">
                    録音できない場合でも、画面右上のアップロードボタンから録音済み音声を解析できます。
                </div>
                <button id="closeMicHelpMainBtn" type="button" class="w-full bg-brand text-white font-bold rounded-lg py-2.5 hover:bg-brand-dark">閉じる</button>
            </div>
        </div>
    </div>

    <!-- 通知アラート領域 -->
    <div id="toastContainer" class="fixed top-safe mt-4 left-1/2 transform -translate-x-1/2 z-[60] w-full max-w-sm px-4 pointer-events-none flex flex-col gap-2"></div>

    <footer class="bg-white border-t border-gray-200 py-3 text-center shrink-0">
        <p class="text-xs text-gray-400 font-medium tracking-wider">作成元：光井企画工学事務所　バージョン 2.06SP (出力選択・スリープ防止対応)</p>
    </footer>

    <script>
        // --- 状態管理 ---
        let isRecording = false;
        let isProcessingFile = false;
        let stream = null; 
        let micStream = null;
        let sysStream = null;
        let audioCtx = null;

        let chunkTimer = null;
        let progressInterval = null;
        let startTime = 0;
        let currentIntervalSeconds = 300; 
        let processCounter = 0;
        let supportedMimeType = '';
        
        let currentFullSummary = ""; 
        let currentFullTranscript = ""; 
        let cachedDocxSummary = '';
        let cachedDocxBlob = null;
        let cachedDocxPromise = null;

        // ★追加：スリープ防止（Wake Lock）用の変数
        let wakeLock = null;
        // CDNが読めない環境でも、アプリ本体まで停止させない。
        const noSleep = typeof NoSleep !== 'undefined' ? new NoSleep() : null;

        // --- DOM要素 ---
        const recordBtn = document.getElementById('recordBtn');
        const recordIcon = document.getElementById('recordIcon');
        const recordText = document.getElementById('recordText');
        const forceProcessBtn = document.getElementById('forceProcessBtn'); 
        const uploadLabelWrapper = document.getElementById('uploadLabelWrapper');
        const audioFileInput = document.getElementById('audioFileInput');
        
        const panelTranscript = document.getElementById('panelTranscript');
        const panelSummary = document.getElementById('panelSummary');
        const tabTranscript = document.getElementById('tabTranscript');
        const tabSummary = document.getElementById('tabSummary');
        
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const clearApiKeyBtn = document.getElementById('clearApiKeyBtn');
        const themeInput = document.getElementById('themeInput');
        const participantsInput = document.getElementById('participantsInput');
        const clearMeetingInfoBtn = document.getElementById('clearMeetingInfoBtn');
        const modeSelect = document.getElementById('modeSelect');
        const intervalSelect = document.getElementById('intervalSelect');
        const modalResetBtn = document.getElementById('modalResetBtn');
        
        const statusIndicator = document.getElementById('statusIndicator');
        const transcriptArea = document.getElementById('transcriptArea');
        const summaryContent = document.getElementById('summaryContent');
        const progressBar = document.getElementById('progressBar');
        const processCountSpan = document.getElementById('processCount');
        const loadingToast = document.getElementById('loadingToast');
        
        const exportDropdownBtn = document.getElementById('exportDropdownBtn');
        const exportMenu = document.getElementById('exportMenu');
        const exportDocxBtn = document.getElementById('exportDocxBtn'); 
        const exportTxtBtn = document.getElementById('exportTxtBtn');
        const copySummaryBtn = document.getElementById('copySummaryBtn');
        const copyTranscriptBtn = document.getElementById('copyTranscriptBtn');
        const micHelpModal = document.getElementById('micHelpModal');
        const micHelpMessage = document.getElementById('micHelpMessage');
        const closeMicHelpBtn = document.getElementById('closeMicHelpBtn');
        const closeMicHelpMainBtn = document.getElementById('closeMicHelpMainBtn');

        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        } else {
            console.warn("Lucide icon library not loaded.");
        }
        if (typeof marked !== 'undefined') {
            marked.setOptions({ gfm: true, breaks: true });
        }

        // --- 初期設定とストレージ ---
        document.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key_kitakyushu');
            if (savedKey) apiKeyInput.value = savedKey;
            
            const savedTheme = localStorage.getItem('meeting_theme');
            if (savedTheme) themeInput.value = savedTheme;
            
            const savedParticipants = localStorage.getItem('meeting_participants');
            if (savedParticipants) participantsInput.value = savedParticipants;

            // WakeLock再取得リスナー（アプリが裏から戻ってきた時用）
            document.addEventListener('visibilitychange', async () => {
                if (wakeLock !== null && document.visibilityState === 'visible' && isRecording) {
                    await requestWakeLock();
                }
            });
        });

        // 同じブラウザでは次回以降も再入力しなくてよいよう、端末内だけに保存する。
        apiKeyInput.addEventListener('input', (e) => localStorage.setItem('gemini_api_key_kitakyushu', e.target.value.trim()));
        clearApiKeyBtn.addEventListener('click', () => {
            localStorage.removeItem('gemini_api_key_kitakyushu');
            apiKeyInput.value = '';
            showNotification('保存したAPIキーを消去しました。');
        });
        themeInput.addEventListener('input', (e) => localStorage.setItem('meeting_theme', e.target.value.trim()));
        participantsInput.addEventListener('input', (e) => localStorage.setItem('meeting_participants', e.target.value.trim()));
        clearMeetingInfoBtn.addEventListener('click', () => {
            localStorage.removeItem('meeting_theme');
            localStorage.removeItem('meeting_participants');
            themeInput.value = '';
            participantsInput.value = '';
            showNotification('記憶した会議テーマと参加者名を消去しました。');
        });

        function getApiKey() {
            const key = apiKeyInput.value.trim();
            if (!key) {
                showNotification("設定(⚙️)からGemini APIキーを入力してください。", true);
                openSettingsModal();
                return null;
            }
            return key;
        }

        // --- スリープ防止機能 (Wake Lock API) ---
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Screen Wake Lock is active');
                } else {
                    // 古いiOS向けフォールバック
                    if (noSleep) {
                        noSleep.enable();
                        console.log('NoSleep.js is active');
                    }
                }
            } catch (err) {
                console.error(`Wake Lock error: ${err.name}, ${err.message}`);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
            if (noSleep) noSleep.disable();
        }

        // 共通のファイル出力・共有処理関数
        async function exportAndShareFile(blob, extension, mimeType) {
            const fileName = '議事録_' + new Date().toLocaleDateString('ja-JP').replace(/\//g, '') + extension;
            const file = new File([blob], fileName, { type: mimeType });
            exportMenu.classList.remove('show');
            let completed = false;

            // 共有APIが利用可能でも、ユーザー操作判定や共有先の都合で失敗することがある。
            if (navigator.share && navigator.canShare) {
                try {
                    if (navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            files: [file],
                            title: 'AI議事録',
                            text: '作成された議事録ドキュメントです。'
                        });
                        showNotification('ドキュメントを共有しました。');
                        completed = true;
                    }
                } catch (err) {
                    if (err.name === 'AbortError') return false;
                    console.warn('Web Share API failed. Falling back to file save.', err);
                }
            }

            // 共有できなければ、対応ブラウザではファイル保存ダイアログを試す。
            if (!completed && window.showSaveFilePicker) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: fileName,
                        types: [{ description: 'ドキュメント', accept: { [mimeType]: [extension] } }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    showNotification('ドキュメントを保存しました。');
                    completed = true;
                } catch (err) {
                    if (err.name === 'AbortError') return false;
                    console.warn('File System Access API failed. Falling back to download.', err);
                }
            }

            // 最後は必ず通常ダウンロードを試す。
            if (!completed) {
                try {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    a.style.display = 'none';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    // click直後に破棄するとブラウザによっては0バイトになるため遅延させる。
                    setTimeout(() => URL.revokeObjectURL(url), 60000);
                    showNotification('ドキュメントをダウンロードしました。Googleドライブへアップロードできます。');
                    completed = true;
                } catch (err) {
                    console.error('Download fallback failed.', err);
                    showNotification(`出力に失敗しました。\n${err.message}`, true);
                    return false;
                }
            }

            if (completed) {
                // ボタンのアニメーション
                const originalHTML = exportDropdownBtn.innerHTML;
                exportDropdownBtn.innerHTML = '<i data-lucide="check" class="w-3 h-3"></i> <span class="hidden sm:inline">完了</span><span class="sm:hidden">完了</span>';
                exportDropdownBtn.className = exportDropdownBtn.className.replace("text-brand border-brand/30 hover:bg-brand hover:text-white", "text-green-600 border-green-600/30 bg-green-50");
                if (typeof lucide !== 'undefined') lucide.createIcons();
                setTimeout(() => {
                    exportDropdownBtn.innerHTML = originalHTML;
                    exportDropdownBtn.className = exportDropdownBtn.className.replace("text-green-600 border-green-600/30 bg-green-50", "text-brand border-brand/30 hover:bg-brand hover:text-white");
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }, 2000);
            }
            return completed;
        }


        // --- Google Docsでも読める標準OOXMLの .docx 生成 ---
        function markdownInlineToDocxRuns(text, TextRun) {
            const normalized = String(text || '')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1 ($2)')
                .replace(/~~([^~]+)~~/g, '$1')
                .replace(/`([^`]+)`/g, '$1');

            return normalized.split(/(\*\*[^*]+\*\*)/g)
                .filter(Boolean)
                .map(part => {
                    const bold = part.startsWith('**') && part.endsWith('**');
                    return new TextRun({
                        text: bold ? part.slice(2, -2) : part,
                        bold
                    });
                });
        }

        async function createStandardDocxBlob(markdown) {
            if (typeof docx === 'undefined') {
                throw new Error('DOCX生成ライブラリを読み込めませんでした。通信状態を確認してください。');
            }

            const {
                Document: DocxDocument,
                Packer,
                Paragraph,
                TextRun,
                HeadingLevel,
                AlignmentType
            } = docx;

            const paragraphs = [
                new Paragraph({
                    text: 'AI議事録',
                    heading: HeadingLevel.TITLE,
                    alignment: AlignmentType.CENTER,
                    spacing: { after: 120 }
                }),
                new Paragraph({
                    children: [new TextRun({ text: `出力日時：${new Date().toLocaleString('ja-JP')}`, color: '666666', size: 18 })],
                    alignment: AlignmentType.RIGHT,
                    spacing: { after: 300 }
                })
            ];

            let inCodeBlock = false;
            String(markdown || '').replace(/\r\n/g, '\n').split('\n').forEach(rawLine => {
                const line = rawLine.replace(/\t/g, '    ');
                const trimmed = line.trim();

                if (/^```/.test(trimmed)) {
                    inCodeBlock = !inCodeBlock;
                    return;
                }
                if (!trimmed) {
                    paragraphs.push(new Paragraph({ text: '', spacing: { after: 40 } }));
                    return;
                }

                const heading = trimmed.match(/^(#{1,6})\s+(.+)$/);
                if (heading) {
                    const levels = [
                        HeadingLevel.HEADING_1,
                        HeadingLevel.HEADING_2,
                        HeadingLevel.HEADING_3,
                        HeadingLevel.HEADING_4,
                        HeadingLevel.HEADING_5,
                        HeadingLevel.HEADING_6
                    ];
                    paragraphs.push(new Paragraph({
                        children: markdownInlineToDocxRuns(heading[2], TextRun),
                        heading: levels[heading[1].length - 1],
                        keepNext: true,
                        spacing: { before: 240, after: 120 }
                    }));
                    return;
                }

                if (/^([-*_])\1\1+$/.test(trimmed)) {
                    paragraphs.push(new Paragraph({ thematicBreak: true }));
                    return;
                }

                const bullet = line.match(/^(\s*)[-+*]\s+(.+)$/);
                if (bullet) {
                    const level = Math.min(Math.floor(bullet[1].length / 2), 5);
                    paragraphs.push(new Paragraph({
                        children: markdownInlineToDocxRuns(bullet[2], TextRun),
                        bullet: { level },
                        spacing: { after: 80 }
                    }));
                    return;
                }

                const numbered = line.match(/^(\s*)(\d+)[.)]\s+(.+)$/);
                if (numbered) {
                    const level = Math.min(Math.floor(numbered[1].length / 2), 5);
                    paragraphs.push(new Paragraph({
                        children: markdownInlineToDocxRuns(`${numbered[2]}. ${numbered[3]}`, TextRun),
                        indent: { left: 360 * (level + 1), hanging: 240 },
                        spacing: { after: 80 }
                    }));
                    return;
                }

                const quote = trimmed.match(/^>\s?(.*)$/);
                if (quote) {
                    paragraphs.push(new Paragraph({
                        children: [new TextRun({ text: quote[1], italics: true, color: '555555' })],
                        indent: { left: 480 },
                        spacing: { after: 100 }
                    }));
                    return;
                }

                paragraphs.push(new Paragraph({
                    children: inCodeBlock
                        ? [new TextRun({ text: trimmed, font: 'Consolas', size: 19 })]
                        : markdownInlineToDocxRuns(trimmed, TextRun),
                    spacing: { after: 120, line: 360 }
                }));
            });

            const documentFile = new DocxDocument({
                creator: 'AI議事録ツール',
                title: 'AI議事録',
                description: 'Geminiで生成した議事録',
                styles: {
                    default: {
                        document: {
                            run: { font: 'Yu Gothic', size: 22 },
                            paragraph: { spacing: { line: 360, after: 120 } }
                        }
                    }
                },
                sections: [{
                    properties: {
                        page: { margin: { top: 1134, right: 1134, bottom: 1134, left: 1134 } }
                    },
                    children: paragraphs
                }]
            });

            return Packer.toBlob(documentFile);
        }

        function prepareDocxCache(markdown) {
            const source = String(markdown || '');
            if (cachedDocxSummary === source && cachedDocxBlob) {
                return Promise.resolve(cachedDocxBlob);
            }
            if (cachedDocxSummary === source && cachedDocxPromise) {
                return cachedDocxPromise;
            }

            cachedDocxSummary = source;
            cachedDocxBlob = null;
            cachedDocxPromise = createStandardDocxBlob(source)
                .then(blob => {
                    if (cachedDocxSummary === source) cachedDocxBlob = blob;
                    return blob;
                })
                .catch(error => {
                    if (cachedDocxSummary === source) {
                        cachedDocxSummary = '';
                        cachedDocxBlob = null;
                        cachedDocxPromise = null;
                    }
                    throw error;
                });
            return cachedDocxPromise;
        }

            // 生のテキストデータに BOM を付与してUTF-8として認識させる（文字化け防止）

            await exportAndShareFile(blob, '.txt', 'text/plain');

        // コピー機能
        function copyToClipboard(text, successMsg) {
            if (!text || text.trim() === "") { showNotification("コピーするデータがありません。", true); return; }
            const textarea = document.createElement('textarea');
            textarea.value = text; textarea.style.position = 'fixed'; textarea.style.opacity = '0';
            document.body.appendChild(textarea); textarea.select();
            try {
                if (document.execCommand('copy')) showNotification(successMsg);
                else throw new Error("Failed");
            } catch (err) { showNotification("コピーに失敗しました。", true); } 
            finally { document.body.removeChild(textarea); }
        }

        function copyRichText(elementId, successMsg) {
            const el = document.getElementById(elementId);
            if (!el || currentFullSummary.trim() === "") { showNotification("コピーする議事録がありません。", true); return; }
            const selection = window.getSelection(); const range = document.createRange();
            range.selectNodeContents(el); selection.removeAllRanges(); selection.addRange(range);
            try {
                if (document.execCommand('copy')) {
                    selection.removeAllRanges();
                    showNotification(successMsg);
                } else throw new Error("Failed");
            } catch (err) { showNotification("コピーに失敗しました。", true); }
        }

        // --- データリセット (モーダル内) ---
        modalResetBtn.addEventListener('click', () => {
            if (isRecording || isProcessingFile) { showNotification("処理中はリセットできません。", true); closeSettingsModal(); return; }
            if (confirm("これまでの文字起こしと議事録データがすべて消去されます。よろしいですか？")) {

                cachedDocxSummary = ''; cachedDocxBlob = null; cachedDocxPromise = null;
                transcriptArea.innerHTML = `<p class="text-gray-400 italic text-xs sm:text-sm text-center mt-10" id="transcriptPlaceholder">録音を開始すると、ここに文字起こしが追加されます。</p>`;
                summaryContent.innerHTML = `<p class="text-gray-400 italic text-xs sm:text-sm text-center mt-10" id="summaryPlaceholder">音声の解析が進むと、最新の議事録がここに生成されます。</p>`;
                closeSettingsModal();
                showNotification("データをリセットしました。");

        // --- 録音処理 ---
        let currentRecorder = null;
        // 録音は継続しつつ、Gemini処理だけは順番に実行して議事録の上書き競合を防ぐ。
        let processingQueue = Promise.resolve();

        async function startRecording() {
            const currentApiKey = getApiKey();
            if (!currentApiKey) return;

            const mode = modeSelect.value;
            supportedMimeType = getSupportedMimeType();
            
            if (!supportedMimeType) { showNotification("ブラウザが音声録音に非対応です。", true); return; }

            try {
                if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
                    const mediaError = new Error('MediaDevices API is unavailable');
                    mediaError.name = 'MediaDevicesUnavailable';
                    throw mediaError;
                }

                if (mode === 'mix') {
                    if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream) {
                        showNotification("【iPhone・iPadではオンライン会議モードを利用できません】\n対面会議モードに切り替えてご利用ください。", true);
                        openSettingsModal();
                        return;
                    }
                    showNotification("【重要】画面共有ポップアップが出たら、必ず「タブの音声を共有」または「システムオーディオも共有」にチェックを入れてください。");
                    
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    sysStream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: "browser" }, audio: true });
                    if (sysStream.getAudioTracks().length === 0) throw new Error("NO_AUDIO_TRACK");

                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const dest = audioCtx.createMediaStreamDestination();
                    audioCtx.createMediaStreamSource(micStream).connect(dest);
                    audioCtx.createMediaStreamSource(sysStream).connect(dest);
                    stream = dest.stream;
                    sysStream.getVideoTracks()[0].onended = () => { if(isRecording) stopRecording(); };
                } else {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    stream = micStream;
                }

                isRecording = true;
                currentIntervalSeconds = parseInt(intervalSelect.value, 10);
                
                // ★追加：録音開始と同時にスリープ防止をリクエスト
                await requestWakeLock();
                
                updateUIState(true, false);
                recordingLoop(currentApiKey);

            } catch (err) {
                cleanupStreams(); 
                if (err.message === "NO_AUDIO_TRACK") showNotification("PCの音声が取得できませんでした。\n必ず「システム音声も共有」にチェックを入れてください。", true);
                else if (err.name === 'NotAllowedError' || err.name === 'SecurityError' || err.name === 'MediaDevicesUnavailable') {
                    showNotification("マイクを利用できません。案内を確認してください。", true);
                    await showMicrophoneHelp(err);
                }
                else showNotification("録音の開始に失敗しました。", true);
            }
        }

        function cleanupStreams() {
            if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
            if (sysStream) { sysStream.getTracks().forEach(t => t.stop()); sysStream = null; }
            if (audioCtx) { audioCtx.close(); audioCtx = null; }
            stream = null;
        }

        function stopRecording() {
            isRecording = false;
            
            // ★追加：録音停止時にスリープ防止を解除
            releaseWakeLock();
            
            if (chunkTimer) clearTimeout(chunkTimer);
            if (progressInterval) clearInterval(progressInterval);
            if (currentRecorder && currentRecorder.state !== 'inactive') {
                currentRecorder.stop(); 
            } else {
                cleanupStreams(); 
                updateUIState(false);
            }
        }

        forceProcessBtn.addEventListener('click', () => {
            if (!isRecording || !currentRecorder) return;
            if (chunkTimer) clearTimeout(chunkTimer);
            if (currentRecorder.state !== 'inactive') {
                showNotification("現在の録音データを解析に回しています...");
                currentRecorder.stop(); 
            }
        });

        async function recordingLoop(apiKey) {
            while (isRecording) {
                await recordAndProcessChunk(apiKey);
            }
            cleanupStreams();
            updateUIState(false);
            progressBar.style.width = '0%';
        }

        function recordAndProcessChunk(apiKey) {
            return new Promise((resolve) => {
                if (!isRecording) { resolve(); return; }

                const options = supportedMimeType ? { mimeType: supportedMimeType } : {};
                try { currentRecorder = new MediaRecorder(stream, options); } 
                catch(e) { currentRecorder = new MediaRecorder(stream); }
                
                const chunks = [];
                currentRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };

                currentRecorder.onstop = () => {
                    const audioType = supportedMimeType || 'audio/webm';
                    const audioBlob = new Blob(chunks, { type: audioType });
                    const chunkIndex = processCounter + 1;
                    
                    resolve(); 

                    if (audioBlob.size > 0 && (isRecording || chunks.length > 0)) {
                        processCounter++;
                        processCountSpan.textContent = `${processCounter}回更新`;
                        processingQueue = processingQueue.then(() =>
                            processAudioWithGemini(audioBlob, chunkIndex, audioType, apiKey)
                        );
                    }
                };

                currentRecorder.start();
                
                startTime = Date.now();
                if (progressInterval) clearInterval(progressInterval);
                progressInterval = setInterval(() => {
                    const elapsed = (Date.now() - startTime) / 1000;
                    const percent = Math.min((elapsed / currentIntervalSeconds) * 100, 100);
                    progressBar.style.width = `${percent}%`;
                }, 100);

                chunkTimer = setTimeout(() => {
                    if (currentRecorder.state !== 'inactive') {
                        currentRecorder.stop();
                    }
                }, currentIntervalSeconds * 1000);
            });
        }

        // --- ファイルアップロード処理 ---
        audioFileInput.addEventListener('change', async (e) => {
            if (isRecording || isProcessingFile) { showNotification("現在処理中です。", true); audioFileInput.value = ''; return; }
            const currentApiKey = getApiKey(); if (!currentApiKey) { audioFileInput.value = ''; return; }
            const file = e.target.files[0]; if (!file) return;

            // Base64化で約1.33倍になるため、GASとGeminiのリクエスト上限に余裕を持たせる。
            if (file.size > 12 * 1024 * 1024) { showNotification('ファイルサイズが大きすぎます（上限12MB）。長い音声は分割してください。', true); audioFileInput.value = ''; return; }

            isProcessingFile = true; updateUIState(true, true);
            
            try {
                const chunkIndex = processCounter + 1;
                const succeeded = await processAudioWithGemini(file, chunkIndex, file.type || 'audio/mpeg', currentApiKey);
                if (succeeded) {
                    processCounter++;
                    processCountSpan.textContent = `${processCounter}回更新`;
                    showNotification("音声ファイルの解析が完了しました。");
                }
            } catch (error) {
                console.error("[File] Processing error:", error);
            } finally {
                isProcessingFile = false; audioFileInput.value = ''; updateUIState(false);
            }
        });

        // --- Gemini API連携 ---
        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject; reader.readAsDataURL(blob);
            });
        }

        async function callGeminiOnServer(apiKey, payload) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
                const apiMessage = data && data.error && data.error.message ? data.error.message : '詳細不明';
                if (response.status === 400 && /api key|API_KEY_INVALID/i.test(apiMessage)) {
                    throw new Error('認証エラー (400): APIキーが正しくないか、無効です。');
                }
                if (response.status === 403) throw new Error('権限エラー (403): APIキーの制限を確認してください。');
                if (response.status === 429) throw new Error('API制限エラー (429): しばらく待って再試行してください。');
                throw new Error(`Gemini APIエラー (${response.status}): ${apiMessage}`);
            }
            return data;
        }

        async function callGeminiWithRetry(apiKey, payload, maxRetries = 3) {
            const delays = [2000, 4000, 6000];
            for (let i = 0; i < maxRetries; i++) {
                try {
                    return await callGeminiOnServer(apiKey, payload);
                } catch (error) {
                    const message = error && error.message ? error.message : String(error);
                    if (i === maxRetries - 1) throw error;
                    if (/認証エラー|権限エラー|API制限エラー/.test(message)) throw error;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        }

        async function processAudioWithGemini(blob, chunkIndex, audioType, apiKey) {
            loadingToast.classList.remove('opacity-0');
            const pTheme = themeInput.value.trim();
            const pUsers = participantsInput.value.trim();
            
            let contextStr = "";
            if (pTheme) contextStr += `\n【会議のテーマ】\n${pTheme}\n`;
            if (pUsers) contextStr += `\n【主な参加者】\n${pUsers}\n`;

            try {
                const base64Audio = await blobToBase64(blob);
                const cleanMimeType = audioType.split(';')[0]; 

                const prompt = `あなたは優秀な議事録作成アシスタントです。
これまで作成された「現在の全体議事録」と、「新しく録音された音声セグメント」が提供されます。
${contextStr}
【指示】
1. 文字起こし: 今回の音声セグメントを正確に文字起こししてください。文脈や【主な参加者】の情報を活用して話者を識別し「話者A: 〇〇」のように明記してください。
2. 議事録の更新: 【現在の全体議事録】の内容をベースに、今回の音声の内容を追加・統合して、最新の「1つの統合された議事録」を作成してください。
   - **詳細な記録**: 過度な要約は避け、議論のプロセスや懸念点を具体的に残すこと。
   - **構造化**: 必ずMarkdownの階層構造（「会議の目的」「議論の詳細」「決定事項」「今後のToDo」など）を維持し、最後まで出力しきること（途中でフォーマットを崩さない）。

【現在の全体議事録】
${currentFullSummary || "まだ議事録はありません。今回の音声から議事録の作成を開始してください。"}
`;

                const payload = {
                    contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: cleanMimeType, data: base64Audio } }] }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        maxOutputTokens: 8192, 
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                transcript: { type: "STRING", description: "話者名を含めた文字起こし" },
                                summary: { type: "STRING", description: "統合・更新された最新の全体議事録(Markdown形式)" }
                            },
                            required: ["transcript", "summary"]
                        }
                    }
                };

                const data = await callGeminiWithRetry(apiKey, payload);

                const parts = data && data.candidates && data.candidates[0] && data.candidates[0].content
                    ? data.candidates[0].content.parts || []
                    : [];
                const responseText = parts.map(part => part && part.text ? part.text : '').join('').trim();
                if (responseText) {
                    const result = parseGeminiStructuredResponse(responseText);
                    const normalizedSummary = normalizeSummaryMarkdown(result.summary);
                    if (normalizedSummary && !normalizedSummary.includes("エラーにより")) {
                        currentFullSummary = normalizedSummary;
                        // 表示更新後にDOCXを事前生成し、共有ボタン押下時のユーザー操作判定切れを防ぐ。
                        prepareDocxCache(currentFullSummary).catch(error => console.warn('DOCX pre-generation failed.', error));
                    }
                    appendResults(result.transcript || '', normalizedSummary, chunkIndex);
                    return true;
                } else {
                    throw new Error('Geminiから議事録データが返されませんでした。安全設定または入力音声を確認してください。');
                }
            } catch (error) {
                console.error(`Gemini API Error (Chunk #${chunkIndex}):`, error);
                showNotification(error.message, true); 
                appendResults(`*(処理失敗)*\n${error.message}`, null, chunkIndex, true);
                return false;
            } finally { loadingToast.classList.add('opacity-0'); }
        }

        function parseGeminiStructuredResponse(responseText) {
            let jsonText = String(responseText || '')
                .replace(/^```json\s*/i, '')
                .replace(/```\s*$/, '')
                .trim();
            try {
                return JSON.parse(jsonText);
            } catch (firstError) {
                const firstBrace = jsonText.indexOf('{');
                const lastBrace = jsonText.lastIndexOf('}');
                if (firstBrace >= 0 && lastBrace > firstBrace) {
                    return JSON.parse(jsonText.slice(firstBrace, lastBrace + 1));
                }
                throw new Error('Geminiの応答形式を読み取れませんでした。再度解析してください。');
            }
        }

        function normalizeSummaryMarkdown(value) {
            return String(value || '')
                .replace(/^\uFEFF/, '')
                .replace(/\r\n?/g, '\n')
                .replace(/^```(?:markdown|md)?\s*/i, '')
                .replace(/```\s*$/, '')
                .replace(/\u200B/g, '')
                .trim();
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function sanitizeHtml(html) {
            const template = document.createElement('template');
            template.innerHTML = html;
            template.content.querySelectorAll('script, iframe, object, embed, link, meta').forEach(el => el.remove());
            template.content.querySelectorAll('*').forEach(el => {
                [...el.attributes].forEach(attr => {
                    const name = attr.name.toLowerCase();
                    const value = attr.value.trim().toLowerCase();
                    if (name.startsWith('on') || ((name === 'href' || name === 'src') && value.startsWith('javascript:'))) {
                        el.removeAttribute(attr.name);
                    }
                });
            });
            return template.innerHTML;
        }

        function appendResults(transcript, summary, chunkIndex, isError = false) {
            const loadingPlaceholder = document.getElementById('loadingPlaceholder');
            if (loadingPlaceholder) loadingPlaceholder.remove();
            
            const timeStr = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
            const bgColor = isError ? 'bg-red-50 border-red-200' : 'bg-white border-gray-200';
            
            if (!isError && transcript) { currentFullTranscript += `[${timeStr} - パート${chunkIndex}]\n${transcript}\n\n`; }
            const formattedTranscript = escapeHtml(transcript).replace(/^(話者[A-Z]+|Speaker\s*[A-Z]+|男性|女性|参加者[0-9]*)\s*:/gim, '<strong class="text-brand">$1:</strong>');

            const transcriptHtml = `
                <div class="${bgColor} p-3 sm:p-4 rounded-lg border shadow-sm fade-in mb-3">
                    <div class="flex items-center gap-2 mb-2 pb-2 border-b border-gray-100">
                        <span class="bg-gray-100 text-gray-500 text-[10px] sm:text-xs px-2 py-0.5 rounded border border-gray-200">#${chunkIndex}</span>
                        <span class="text-[10px] sm:text-xs text-gray-400"><i data-lucide="clock" class="w-3 h-3 inline mr-1"></i>${timeStr} 完了</span>
                    </div>
                    <div class="text-xs sm:text-sm text-gray-700 whitespace-pre-wrap leading-relaxed">${formattedTranscript}</div>
                </div>
            `;
            transcriptArea.insertAdjacentHTML('beforeend', transcriptHtml);
            transcriptArea.scrollTop = transcriptArea.scrollHeight;

            if (!isError && summary) { 
                summaryContent.innerHTML = typeof marked !== 'undefined'
                    ? sanitizeHtml(marked.parse(summary))
                    : `<pre class="whitespace-pre-wrap">${escapeHtml(summary)}</pre>`;
                if (window.innerWidth < 1024 && document.getElementById('tabTranscript').classList.contains('tab-active')) {
                    switchTab('summary');
                }
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        recordBtn.addEventListener('click', () => {
            if (isProcessingFile) { showNotification("ファイル解析中は中断できません。", true); return; }
            if (isRecording) stopRecording(); else startRecording();
        });

    </script>
</body>
</html>
