<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AI議事録">
  <title>AI議事録ツール</title>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nosleep/0.12.0/NoSleep.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .recording-pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgb(239 68 68 / .65); } 70% { box-shadow: 0 0 0 12px rgb(239 68 68 / 0); } 100% { box-shadow: 0 0 0 0 rgb(239 68 68 / 0); } }
    #summaryContent { overflow-wrap:anywhere; color:#334155; font-size:15px; line-height:1.8; }
    #summaryContent > :first-child { margin-top:0; }
    #summaryContent h1 { color:#0f2f72; font-size:1.55rem; line-height:1.4; letter-spacing:.02em; border-bottom:3px solid #1d4ed8; padding-bottom:.55rem; margin-bottom:1.2rem; }
    #summaryContent h2 { color:#143477; font-size:1.15rem; line-height:1.5; border-left:4px solid #2563eb; background:#eff6ff; border-radius:0 8px 8px 0; padding:.45rem .75rem; margin-top:1.8rem; margin-bottom:.8rem; }
    #summaryContent h3 { color:#1e40af; font-size:1rem; line-height:1.5; margin-top:1.3rem; margin-bottom:.45rem; }
    #summaryContent p, #summaryContent li { margin-top:.3rem; margin-bottom:.3rem; }
    #summaryContent ul, #summaryContent ol { padding-left:1.4rem; }
    #summaryContent li::marker { color:#2563eb; }
    #summaryContent strong { color:#0f172a; font-weight:700; }
    #summaryContent table { display:block; overflow-x:auto; max-width:100%; border-collapse:separate; border-spacing:0; font-size:.9rem; line-height:1.55; border:1px solid #cbd5e1; border-radius:8px; margin:1rem 0; }
    #summaryContent th, #summaryContent td { border-bottom:1px solid #e2e8f0; padding:9px 12px; vertical-align:top; min-width:6rem; }
    #summaryContent tr:last-child td { border-bottom:0; }
    #summaryContent th { background:#e8f0ff; color:#173b7a; font-weight:700; white-space:nowrap; }
    #summaryContent tr:nth-child(even) td { background:#f8fafc; }
    #summaryContent blockquote { border-left:3px solid #93c5fd; background:#f8fafc; padding:.4rem .9rem; font-style:normal; }
    @media (max-width:640px) { #summaryContent { font-size:14px; line-height:1.75; } #summaryContent h1 { font-size:1.3rem; } #summaryContent table { font-size:13px; } }
    .toast { animation: slidein .2s ease-out; }
    @keyframes slidein { from { transform:translateY(-12px); opacity:0; } to { transform:translateY(0); opacity:1; } }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <header class="sticky top-0 z-20 flex items-center justify-between gap-3 border-b border-slate-200 bg-white px-4 py-3 shadow-sm">
    <div class="flex items-center gap-2">
      <span class="rounded-lg bg-blue-800 p-2 text-white"><i data-lucide="mic-2" class="h-5 w-5"></i></span>
      <div><h1 class="font-bold leading-tight">AI議事録ツール</h1><p class="text-xs text-slate-500">v5.4 · Gemini 4 Neon / Argon</p></div>
    </div>
    <div class="flex items-center gap-2">
      <label id="uploadLabel" title="音声ファイルを解析" class="cursor-pointer rounded-lg border border-slate-200 bg-slate-100 p-2 text-slate-700 hover:bg-slate-200"><i data-lucide="upload" class="h-5 w-5"></i><input id="audioFileInput" class="hidden" type="file" accept="audio/*"></label>
      <button id="settingsBtn" title="設定" class="rounded-lg border border-slate-200 bg-slate-100 p-2 text-slate-700 hover:bg-slate-200"><i data-lucide="settings" class="h-5 w-5"></i></button>
      <button id="recordBtn" class="flex items-center gap-1 rounded-lg bg-blue-800 px-4 py-2 font-bold text-white shadow-sm hover:bg-blue-900"><i id="recordIcon" data-lucide="play" class="h-4 w-4"></i><span id="recordText">開始</span></button>
    </div>
  </header>

  <div id="progressWrap" class="hidden h-1 bg-slate-200"><div id="progressBar" class="h-1 bg-blue-700 transition-all" style="width:0%"></div></div>

  <main class="mx-auto grid max-w-screen-2xl gap-4 p-3 lg:grid-cols-2 lg:p-6">
    <section class="flex min-h-[48vh] flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
      <div class="flex items-center justify-between border-b border-slate-200 px-4 py-3">
        <h2 class="flex items-center gap-2 font-bold"><i data-lucide="users" class="h-4 w-4"></i>文字起こし</h2>
        <div class="flex items-center gap-2"><span id="status" class="rounded-full bg-slate-100 px-2 py-1 text-xs text-slate-600">待機中</span><button id="copyTranscriptBtn" class="rounded border px-2 py-1 text-xs hover:bg-slate-50">コピー</button></div>
      </div>
      <div id="transcriptArea" class="flex-1 space-y-3 overflow-y-auto bg-slate-50/60 p-4"><p id="transcriptPlaceholder" class="mt-12 text-center text-sm italic text-slate-400">録音または音声ファイルの解析を開始すると、ここに文字起こしが追加されます。</p></div>
    </section>

    <section class="flex min-h-[48vh] flex-col overflow-hidden rounded-xl border border-blue-200 bg-white shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-blue-100 bg-blue-50 px-4 py-3">
        <h2 class="flex items-center gap-2 font-bold text-blue-950"><i data-lucide="file-text" class="h-4 w-4"></i>最新の全体議事録</h2>
        <div class="flex items-center gap-2">
          <span id="processCount" class="text-xs text-blue-700">0回更新</span>
          <button id="finalSummaryBtn" class="rounded bg-indigo-700 px-3 py-1.5 text-xs font-bold text-white hover:bg-indigo-800"><i data-lucide="sparkles" class="mr-1 inline h-3 w-3"></i>Argon 最終まとめ</button>
          <button id="exportDocxBtn" class="rounded border border-blue-300 bg-white px-3 py-1.5 text-xs font-bold text-blue-800 hover:bg-blue-800 hover:text-white">Word</button>
          <button id="exportTxtBtn" class="rounded border border-blue-300 bg-white px-3 py-1.5 text-xs font-bold text-blue-800 hover:bg-blue-800 hover:text-white">テキスト</button>
          <button id="copySummaryBtn" class="rounded border border-blue-300 bg-white px-3 py-1.5 text-xs font-bold text-blue-800 hover:bg-blue-800 hover:text-white">コピー</button>
        </div>
      </div>
      <article id="summaryContent" class="prose max-w-none flex-1 overflow-y-auto p-5"><p id="summaryPlaceholder" class="mt-12 text-center text-sm italic text-slate-400">解析が進むと、最新の議事録がここに生成されます。</p></article>
    </section>
  </main>

  <div id="settingsModal" class="fixed inset-0 z-40 hidden items-center justify-center bg-slate-950/50 p-4">
    <div class="max-h-[90vh] w-full max-w-md overflow-y-auto rounded-xl bg-white shadow-2xl">
      <div class="flex items-center justify-between border-b p-4"><h2 class="font-bold">設定</h2><button id="closeSettingsBtn" class="rounded p-1 hover:bg-slate-100"><i data-lucide="x"></i></button></div>
      <div class="space-y-4 p-5">
        <div><label class="mb-1 block text-sm font-bold">Gemini API キー</label><input id="apiKeyInput" type="password" placeholder="AIzaSy..." class="w-full rounded-lg border p-2.5 text-sm"><p class="mt-1 text-xs text-slate-500">キーはこのブラウザ内にのみ保存します。Gemini 4 Neon・Argon の API 利用には有料枠が必要です。</p></div>
        <div><label class="mb-1 block text-sm font-bold">音声認識エンジン</label><select id="engineSelect" class="w-full rounded-lg border bg-white p-2 text-sm"><option value="gemini-3.5-transcribe">Gemini 3.5 Transcribe（読みやすく整形）</option><option value="gemini-4-argon">Gemini 4 Argon（音声から文字起こし）</option></select></div>
        <div><label class="mb-1 block text-sm font-bold">会議のテーマ・目的</label><input id="themeInput" class="w-full rounded-lg border p-2 text-sm" placeholder="例: 新アプリ開発のキックオフ"></div>
        <div><label class="mb-1 block text-sm font-bold">参加者名（カンマ区切り）</label><input id="participantsInput" class="w-full rounded-lg border p-2 text-sm" placeholder="例: 山田, 佐藤, 鈴木"></div>
        <div class="grid grid-cols-2 gap-3"><div><label class="mb-1 block text-sm font-bold">録音モード</label><select id="modeSelect" class="w-full rounded-lg border p-2 text-sm"><option value="mic">対面会議（マイク）</option><option value="mix">オンライン会議</option></select></div><div><label class="mb-1 block text-sm font-bold">解析周期</label><select id="intervalSelect" class="w-full rounded-lg border p-2 text-sm"><option value="60">1分</option><option value="300" selected>5分</option><option value="600">10分</option></select></div></div>
        <button id="resetBtn" class="w-full rounded-lg border border-red-200 bg-red-50 py-2 text-sm font-bold text-red-700 hover:bg-red-100">議事録データをリセット</button>
      </div>
    </div>
  </div>
  <div id="toastContainer" class="pointer-events-none fixed left-1/2 top-4 z-50 flex w-full max-w-md -translate-x-1/2 flex-col gap-2 px-4"></div>

  <script>
  (() => {
    'use strict';
    // Google の Interactions API: 通常更新は Neon、最終版は Argon。
    const MODELS = Object.freeze({ TRANSCRIBE: 'gemini-3.5-transcribe', NEON: 'gemini-4-neon', ARGON: 'gemini-4-argon', FINAL_SUMMARY: 'gemini-4-argon' });
    const STORAGE = Object.freeze({ key:'gemini_api_key_kitakyushu', engine:'transcribe_engine', theme:'meeting_theme', participants:'meeting_participants' });
    let isRecording = false, isProcessingFile = false, stream = null, micStream = null, sysStream = null, audioCtx = null, currentRecorder = null;
    let chunkTimer = null, progressTimer = null, startTime = 0, currentIntervalSeconds = 300, processCounter = 0, supportedMimeType = '';
    let currentFullTranscript = '', currentFullSummary = '', processingQueue = Promise.resolve(), cachedDocxSource = '', cachedDocxBlob = null, cachedDocxPromise = null;
    let wakeLock = null, processingJobs = 0;
    const noSleep = typeof NoSleep !== 'undefined' ? new NoSleep() : null;
    const $ = id => document.getElementById(id);
    const el = { recordBtn:$('recordBtn'), recordIcon:$('recordIcon'), recordText:$('recordText'), uploadLabel:$('uploadLabel'), audioInput:$('audioFileInput'), status:$('status'), transcript:$('transcriptArea'), transcriptPlaceholder:$('transcriptPlaceholder'), summary:$('summaryContent'), progressWrap:$('progressWrap'), progress:$('progressBar'), count:$('processCount'), settings:$('settingsModal'), apiKey:$('apiKeyInput'), engine:$('engineSelect'), theme:$('themeInput'), participants:$('participantsInput'), mode:$('modeSelect'), interval:$('intervalSelect') };

    if (typeof marked !== 'undefined') marked.setOptions({ gfm:true, breaks:true });
    if (typeof lucide !== 'undefined') lucide.createIcons();

    function notify(message, error = false) {
      const toast = document.createElement('div');
      toast.className = `toast rounded-lg px-4 py-3 text-sm font-medium shadow-lg ${error ? 'border-l-4 border-red-500 bg-white text-slate-800' : 'bg-blue-800 text-white'}`;
      toast.textContent = message;
      $('toastContainer').append(toast);
      setTimeout(() => toast.remove(), error ? 9000 : 4000);
    }
    function escapeHtml(value) { const d = document.createElement('div'); d.textContent = String(value ?? ''); return d.innerHTML; }
    function getApiKey() { const key = el.apiKey.value.trim(); if (!key) { notify('設定から Gemini API キーを入力してください。', true); openSettings(); return null; } return key; }
    function loadSettings() { const savedEngine = localStorage.getItem(STORAGE.engine); el.apiKey.value = localStorage.getItem(STORAGE.key) || ''; el.engine.value = savedEngine === MODELS.ARGON || savedEngine === MODELS.TRANSCRIBE ? savedEngine : (savedEngine === 'gemini-3.8-flash' ? MODELS.ARGON : MODELS.TRANSCRIBE); el.theme.value = localStorage.getItem(STORAGE.theme) || ''; el.participants.value = localStorage.getItem(STORAGE.participants) || ''; }
    function saveSetting(key, value) { localStorage.setItem(key, value); }
    async function keepScreenAwake() {
      if (document.visibilityState !== 'visible' || wakeLock || (!isRecording && !isProcessingFile && !processingJobs)) return;
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
          try { noSleep?.disable(); } catch (error) { console.warn('NoSleep:', error); }
          return;
        } catch (error) { console.warn('Screen Wake Lock:', error); }
      }
      try { noSleep?.enable(); } catch (error) { console.warn('NoSleep:', error); }
    }
    function releaseScreenAwakeIfIdle() {
      if (isRecording || isProcessingFile || processingJobs) return;
      if (wakeLock) { const lock = wakeLock; wakeLock = null; lock.release().catch(() => {}); }
      try { noSleep?.disable(); } catch (error) { console.warn('NoSleep:', error); }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') keepScreenAwake();
    });
    loadSettings();
    el.apiKey.addEventListener('input', e => saveSetting(STORAGE.key, e.target.value.trim()));
    el.engine.addEventListener('change', e => saveSetting(STORAGE.engine, e.target.value));
    el.theme.addEventListener('input', e => saveSetting(STORAGE.theme, e.target.value.trim()));
    el.participants.addEventListener('input', e => saveSetting(STORAGE.participants, e.target.value.trim()));

    function openSettings() { el.settings.classList.remove('hidden'); el.settings.classList.add('flex'); }
    function closeSettings() { el.settings.classList.add('hidden'); el.settings.classList.remove('flex'); }
    $('settingsBtn').addEventListener('click', openSettings); $('closeSettingsBtn').addEventListener('click', closeSettings);
    el.settings.addEventListener('click', e => { if (e.target === el.settings) closeSettings(); });

    function updateUi(active, file = false) {
      el.recordIcon.setAttribute('data-lucide', active && !file ? 'square' : 'play');
      el.recordText.textContent = active && !file ? '停止' : '開始';
      el.recordBtn.classList.toggle('bg-red-500', active && !file); el.recordBtn.classList.toggle('bg-blue-800', !(active && !file)); el.recordBtn.classList.toggle('recording-pulse', active && !file);
      el.recordBtn.disabled = file; el.uploadLabel.classList.toggle('pointer-events-none', active); el.uploadLabel.classList.toggle('opacity-50', active);
      el.status.textContent = active ? (file ? 'ファイルを解析中' : '録音中') : '待機中';
      el.status.className = `rounded-full px-2 py-1 text-xs ${active ? (file ? 'bg-blue-100 text-blue-800' : 'bg-red-100 text-red-700') : 'bg-slate-100 text-slate-600'}`;
      el.progressWrap.classList.toggle('hidden', !active); if (!active) el.progress.style.width = '0%';
      if (active && el.transcriptPlaceholder) el.transcriptPlaceholder.remove();
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }
    function getSupportedMimeType() { return ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(type => MediaRecorder.isTypeSupported(type)) || ''; }
    function blobToBase64(blob) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(String(reader.result).split(',')[1]); reader.onerror = reject; reader.readAsDataURL(blob); }); }
    async function audioInputFromBlob(blob, mimeType, apiKey) {
      const type = mimeType.split(';')[0];
      // Base64 化すると約 4/3 に増えるため、20 MB のインライン上限より余裕を持たせる。
      if (blob.size < 14 * 1024 * 1024) return { type:'audio', data:await blobToBase64(blob), mime_type:type };
      notify('大きな音声ファイルを Gemini にアップロードしています。');
      const start = await fetch('https://generativelanguage.googleapis.com/upload/v1beta/files', {
        method:'POST',
        headers:{ 'x-goog-api-key':apiKey, 'X-Goog-Upload-Protocol':'resumable', 'X-Goog-Upload-Command':'start', 'X-Goog-Upload-Header-Content-Length':String(blob.size), 'X-Goog-Upload-Header-Content-Type':type, 'Content-Type':'application/json' },
        body:JSON.stringify({ file:{ display_name:'meeting-audio' } })
      });
      if (!start.ok) throw new Error(`音声アップロードの開始に失敗しました（${start.status}）。`);
      const uploadUrl = start.headers.get('X-Goog-Upload-URL');
      if (!uploadUrl) throw new Error('音声アップロード先を取得できませんでした。');
      const uploaded = await fetch(uploadUrl, { method:'POST', headers:{ 'X-Goog-Upload-Offset':'0', 'X-Goog-Upload-Command':'upload, finalize', 'Content-Type':type }, body:blob });
      const result = await uploaded.json().catch(() => ({}));
      if (!uploaded.ok || !result?.file?.uri) throw new Error(`音声アップロードに失敗しました（${uploaded.status}）。`);
      const fileName = result.file.name;
      if (fileName && result.file.state && result.file.state !== 'ACTIVE') {
        let state = result.file.state;
        for (let attempt = 0; attempt < 20 && state === 'PROCESSING'; attempt++) {
          await new Promise(resolve => setTimeout(resolve, 1500));
          const check = await fetch(`https://generativelanguage.googleapis.com/v1beta/${fileName}`, { headers:{ 'x-goog-api-key':apiKey } });
          if (!check.ok) throw new Error(`音声ファイルの処理状態を確認できませんでした（${check.status}）。`);
          state = (await check.json()).state;
        }
        if (state !== 'ACTIVE') throw new Error('音声ファイルの処理が完了しませんでした。');
      }
      return { type:'audio', uri:result.file.uri, mime_type:type };
    }
    function textFromResponse(data) {
      return (data?.steps || []).filter(step => step.type === 'model_output')
        .flatMap(step => step.content || []).filter(part => part.type === 'text')
        .map(part => part.text || '').join('').trim();
    }
    async function callGemini(model, apiKey, input, transcription = false) {
      const body = { model, input, store:false };
      if (transcription) body.generation_config = { transcription_config:{ mode:'smart', language_codes:['ja-JP'] } };
      const response = await fetch('https://generativelanguage.googleapis.com/v1beta/interactions', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'x-goog-api-key':apiKey, 'Api-Revision':'2026-05-20' },
        body:JSON.stringify(body)
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.status === 'failed') {
        const message = data?.error?.message || data?.error?.details || '詳細不明';
        throw new Error(`Gemini API エラー [${model}]（${response.status}）: ${typeof message === 'string' ? message : JSON.stringify(message)}`);
      }
      return data;
    }
    function meetingInfo() { return `テーマ: ${el.theme.value.trim() || '指定なし'}\n参加者: ${el.participants.value.trim() || '指定なし'}`; }
    function invalidateDocxCache() { cachedDocxSource = ''; cachedDocxBlob = null; cachedDocxPromise = null; }
    function setSummary(markdown) { currentFullSummary = String(markdown || '').trim(); invalidateDocxCache(); el.summary.innerHTML = currentFullSummary ? (typeof marked !== 'undefined' ? marked.parse(currentFullSummary) : escapeHtml(currentFullSummary).replace(/\n/g, '<br>')) : '<p class="text-slate-400">議事録はまだありません。</p>'; }
    function appendTranscript(text, index, isError = false) {
      const time = new Date().toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' });
      if (!isError && text) currentFullTranscript += `[${time} - パート${index}]\n${text}\n\n`;
      const card = document.createElement('div'); card.className = `rounded-lg border p-3 shadow-sm ${isError ? 'border-red-200 bg-red-50' : 'border-slate-200 bg-white'}`;
      card.innerHTML = `<div class="mb-2 border-b border-slate-100 pb-2 text-xs text-slate-400">#${index} · ${time} 完了</div><div class="whitespace-pre-wrap text-sm leading-relaxed text-slate-700">${escapeHtml(text)}</div>`;
      el.transcript.append(card); el.transcript.scrollTop = el.transcript.scrollHeight;
    }

    async function transcribeAudio(blob, mimeType, apiKey) {
      const audio = await audioInputFromBlob(blob, mimeType, apiKey);
      try {
        const data = await callGemini(MODELS.TRANSCRIBE, apiKey, [audio], true);
        const transcript = textFromResponse(data);
        if (transcript) return transcript;
        throw new Error('文字起こし結果が空でした。');
      } catch (error) {
        console.warn('専用文字起こしモデルを利用できないため Argon で再試行します:', error);
        notify('文字起こしを Gemini 4 Argon で再試行しています。');
        return transcribeWithArgon(audio, apiKey);
      }
    }
    async function transcribeWithArgon(audio, apiKey) {
      const data = await callGemini(MODELS.ARGON, apiKey, [{type:'text',text:`この会議音声を、発言を省略せず自然な日本語に文字起こししてください。${meetingInfo()}`},audio]);
      const transcript = textFromResponse(data);
      if (!transcript) throw new Error('文字起こし結果が空でした。');
      return transcript;
    }
    async function createUpdatedMinutes(transcript, apiKey) {
      const prompt = `あなたは正確な日本語の議事録作成者です。現在の議事録に今回の文字起こしを統合し、Markdown形式で完全な最新議事録を返してください。\n\n${meetingInfo()}\n\n【厳守】\n- 発言にない事実、担当者、期限、数値を推測・補完しない。\n- 決定事項は明確に合意された内容だけを記載する。\n- ToDoの担当者・期限が不明なら「未定」と記載する。\n- 過去の議事録の事実を削除・改変せず、今回の内容を反映する。\n- 文書は「# 会議名」「## 会議概要」「## 議題別の詳細」「## 決定事項」「## ToDo」「## 未決事項」の順を基本にする。該当内容がない節は「なし」と記載する。\n\n【現在の全体議事録】\n${currentFullSummary || '（まだありません）'}\n\n【今回の文字起こし】\n${transcript}`;
      const data = await callGemini(MODELS.NEON, apiKey, prompt);
      const minutes = textFromResponse(data); if (!minutes) throw new Error('議事録の生成結果が空でした。'); return minutes;
    }
    async function processAudio(blob, index, mimeType, apiKey, directAudio = false) {
      try {
        let transcript;
        if (directAudio) {
          const audio = await audioInputFromBlob(blob, mimeType, apiKey);
          transcript = await transcribeWithArgon(audio, apiKey);
        } else transcript = await transcribeAudio(blob, mimeType, apiKey);
        const minutes = await createUpdatedMinutes(transcript, apiKey);
        appendTranscript(transcript, index); setSummary(minutes); el.count.textContent = `${index}回更新`;
      } catch (error) { console.error(error); appendTranscript(`処理に失敗しました。\n${error.message}`, index, true); notify(error.message, true); }
      finally { processingJobs = Math.max(0, processingJobs - 1); releaseScreenAwakeIfIdle(); }
    }

    async function startRecording() {
      const apiKey = getApiKey(); if (!apiKey) return;
      supportedMimeType = getSupportedMimeType(); if (!supportedMimeType) { notify('このブラウザは音声録音に対応していません。', true); return; }
      // iPhone の代替手段はユーザー操作中に開始する必要がある。
      try { noSleep?.enable(); } catch (error) { console.warn('NoSleep:', error); }
      try {
        if (el.mode.value === 'mix') {
          micStream = await navigator.mediaDevices.getUserMedia({audio:true}); sysStream = await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
          if (!sysStream.getAudioTracks().length) throw new Error('共有画面の音声が選択されていません。共有時に音声もオンにしてください。');
          audioCtx = new (window.AudioContext || window.webkitAudioContext)(); const destination = audioCtx.createMediaStreamDestination();
          audioCtx.createMediaStreamSource(micStream).connect(destination); audioCtx.createMediaStreamSource(sysStream).connect(destination); stream = destination.stream;
          sysStream.getVideoTracks()[0].onended = () => { if (isRecording) stopRecording(); };
        } else { micStream = await navigator.mediaDevices.getUserMedia({audio:true}); stream = micStream; }
        isRecording = true; currentIntervalSeconds = Number(el.interval.value); updateUi(true); await keepScreenAwake(); recordLoop(apiKey);
      } catch (error) { cleanStreams(); releaseScreenAwakeIfIdle(); notify(`録音を開始できませんでした。${error.message ? ' ' + error.message : ''}`, true); }
    }
    function cleanStreams() { [micStream, sysStream].filter(Boolean).forEach(s => s.getTracks().forEach(t => t.stop())); micStream = sysStream = stream = null; if (audioCtx) { audioCtx.close(); audioCtx = null; } }
    function stopRecording() { isRecording = false; clearTimeout(chunkTimer); clearInterval(progressTimer); if (currentRecorder && currentRecorder.state !== 'inactive') currentRecorder.stop(); }
    async function recordLoop(apiKey) { while (isRecording) await recordChunk(apiKey); cleanStreams(); updateUi(false); releaseScreenAwakeIfIdle(); }
    function recordChunk(apiKey) { return new Promise(resolve => {
      if (!isRecording) return resolve(); const parts = []; currentRecorder = new MediaRecorder(stream, supportedMimeType ? {mimeType:supportedMimeType} : undefined);
      currentRecorder.ondataavailable = e => { if (e.data.size) parts.push(e.data); };
      currentRecorder.onstop = () => { clearInterval(progressTimer); const blob = new Blob(parts, {type:supportedMimeType || 'audio/webm'}); if (blob.size) { const index = ++processCounter; processingJobs++; processingQueue = processingQueue.then(() => processAudio(blob,index,(supportedMimeType || 'audio/webm').split(';')[0],apiKey,el.engine.value === MODELS.ARGON)); } resolve(); };
      currentRecorder.start(); startTime = Date.now(); progressTimer = setInterval(() => el.progress.style.width = `${Math.min(100, (Date.now()-startTime)/1000/currentIntervalSeconds*100)}%`, 150);
      chunkTimer = setTimeout(() => { if (currentRecorder?.state !== 'inactive') currentRecorder.stop(); }, currentIntervalSeconds * 1000);
    }); }
    el.recordBtn.addEventListener('click', () => isRecording ? stopRecording() : startRecording());

    el.audioInput.addEventListener('change', async e => {
      const file = e.target.files?.[0]; e.target.value = ''; if (!file) return;
      const apiKey = getApiKey(); if (!apiKey) return;
      isProcessingFile = true; processingJobs++; updateUi(true, true); await keepScreenAwake(); const index = ++processCounter;
      try { await processAudio(file, index, file.type || 'audio/mpeg', apiKey, el.engine.value === MODELS.ARGON); } finally { isProcessingFile = false; updateUi(false); releaseScreenAwakeIfIdle(); }
    });

    $('finalSummaryBtn').addEventListener('click', async () => {
      if (isRecording) { notify('録音を停止し、処理中の音声解析が完了してから実行してください。', true); return; }
      if (!currentFullTranscript.trim()) { notify('文字起こしデータがありません。', true); return; }
      const apiKey = getApiKey(); if (!apiKey) return;
      const button = $('finalSummaryBtn'); button.disabled = true; button.classList.add('opacity-50');
      processingJobs++; await keepScreenAwake();
      try {
        await processingQueue;
        const prompt = `あなたは会議の内容を実務で使える議事録に編集する専門家です。以下の全文字起こしを読み、提出用の完成版を日本語のMarkdownだけで作成してください。\n\n【会議情報】\n${meetingInfo()}\n\n【編集方針】\n- 最初の30秒で、何が決まり、誰が次に何をするか把握できる順序にする。\n- 文字起こしの時系列をなぞらず、同じ議題の発言をまとめる。繰り返し、雑談、あいづち、言い直しは省く。\n- 結論に至る背景、重要な意見の違い、根拠、条件、金額、日付は残す。短くしすぎて意味が失われないようにする。\n- 決定事項と提案・検討中の案を混同しない。合意が確認できない内容は未決事項に置く。\n- 発言にない事実や参加者名を補わない。話者が確定できなければ人名を断定しない。\n- 担当者・期限が明示されないToDoは「未定」と記載する。ToDoがない場合は捏造せず「なし」とする。\n- 同じ内容を複数の節に繰り返さない。過度な敬語、感想、AIによる注意書きは不要。\n- Markdownの見出し、短い段落、箇条書きを使う。表はToDoの一覧にだけ使い、セル内は短い文にする。絵文字、HTML、コードフェンス、罫線は使わない。\n\n【出力の順序】\n# 会議名（テーマが不明なら「会議議事録」）\n会議日時・参加者は音声または会議情報で確認できた場合のみ、この直下に簡潔に記す。\n## 要点\n重要な結論と次の動きを最大3項目で示す。\n## 決定事項\n明確に決まった内容だけを箇条書きにする。なければ「なし」。\n## ToDo\n「内容 | 担当者 | 期限」の3列のMarkdown表。ToDoがなければ表を作らず「なし」。\n## 議題別の議論\n議題ごとに小見出しを付け、経緯・主な意見・結論を簡潔にまとめる。\n## 未決事項・次回確認\n未決の論点と確認が必要なことを箇条書きにする。なければ「なし」。\n\n【全文字起こし】\n${currentFullTranscript}`;
        const data = await callGemini(MODELS.FINAL_SUMMARY, apiKey, prompt);
        const summary = textFromResponse(data); if (!summary) throw new Error('最終まとめの生成結果が空でした。'); setSummary(summary); notify('Gemini 4 Argon による最終まとめが完了しました。');
      } catch (error) { console.error(error); notify(error.message, true); } finally { processingJobs--; releaseScreenAwakeIfIdle(); button.disabled = false; button.classList.remove('opacity-50'); }
    });

    function copyText(text, message) { if (!text?.trim()) return notify('コピーする内容がありません。', true); navigator.clipboard?.writeText(text).then(() => notify(message)).catch(() => { const area = document.createElement('textarea'); area.value=text; document.body.append(area); area.select(); document.execCommand('copy'); area.remove(); notify(message); }); }
    $('copyTranscriptBtn').addEventListener('click', () => copyText(currentFullTranscript, '文字起こしをコピーしました。'));
    $('copySummaryBtn').addEventListener('click', () => copyText(currentFullSummary, '議事録をコピーしました。'));
    async function saveBlob(blob, extension, mime) { const name = `議事録_${new Date().toLocaleDateString('ja-JP').replaceAll('/','')}${extension}`; const file = new File([blob], name, {type:mime}); if (navigator.canShare?.({files:[file]})) { try { await navigator.share({files:[file],title:'AI議事録'}); return; } catch (e) { if (e.name === 'AbortError') return; } } const url = URL.createObjectURL(blob), a = Object.assign(document.createElement('a'), {href:url,download:name}); a.click(); setTimeout(() => URL.revokeObjectURL(url), 60000); }
    $('exportTxtBtn').addEventListener('click', async () => { if (!currentFullSummary.trim()) return notify('出力する議事録がありません。', true); await saveBlob(new Blob(['\uFEFF',currentFullSummary],{type:'text/plain;charset=utf-8'}), '.txt', 'text/plain'); notify('テキストを出力しました。'); });

    // Word は currentFullSummary（画面に表示している原文）だけから組み立てる。
    // 独自のタイトル・日時を足さないため、Word にだけ別の内容が混ざらない。
    function inlineRuns(value, TextRun) {
      const source = String(value ?? ''); const token = /(\*\*[^*]+\*\*|__[^_]+__|~~[^~]+~~|`[^`]+`|\[[^\]]+\]\([^)]+\)|\*[^*]+\*|_[^_]+_)/g; let last = 0, match, runs = [];
      const plain = text => { if (text) runs.push(new TextRun({text:text.replace(/\\([\\`*_[\]{}()#+.!|-])/g,'$1')})); };
      while ((match = token.exec(source))) { plain(source.slice(last, match.index)); const part = match[0]; let text=part, options={};
        if (/^\*\*|^__/.test(part)) { text=part.slice(2,-2); options.bold=true; } else if (/^~~/.test(part)) { text=part.slice(2,-2); options.strike=true; } else if (/^`/.test(part)) { text=part.slice(1,-1); options.font='Consolas'; options.shading={fill:'F1F5F9'}; } else if (/^\[/.test(part)) { const link=part.match(/^\[([^\]]+)\]\(([^)]+)\)$/); text=link[1]; options.color='0563C1'; options.underline={type:'single'}; } else { text=part.slice(1,-1); options.italics=true; }
        runs.push(new TextRun({text,...options})); last = token.lastIndex;
      } plain(source.slice(last)); return runs.length ? runs : [new TextRun({text:''})];
    }
    function tableCells(line) { const text=line.trim().replace(/^\|/,'').replace(/\|$/,''); const cells=[]; let cell='', escaped=false; for (const char of text) { if (char === '|' && !escaped) { cells.push(cell.trim()); cell=''; } else { cell += char; } escaped = char === '\\' && !escaped; if (char !== '\\') escaped=false; } cells.push(cell.trim()); return cells; }
    function isSeparator(line) { const cells=tableCells(line); return cells.length && cells.every(c => /^:?-{3,}:?$/.test(c.replace(/\s/g,''))); }
    async function createDocx(markdown) {
      if (typeof docx === 'undefined') throw new Error('Word出力ライブラリを読み込めませんでした。');
      const {Document, Packer, Paragraph, TextRun, HeadingLevel, Table, TableRow, TableCell, WidthType, BorderStyle, ShadingType} = docx;
      const children=[], lines=String(markdown || '').replace(/\r\n/g,'\n').split('\n'); let inCode=false;
      const border = {style:BorderStyle.SINGLE,size:4,color:'CBD5E1'};
      const pushTable = (header, rows) => { const makeRow=(cells, head=false) => new TableRow({children:cells.map(value => new TableCell({width:{size:100/cells.length,type:WidthType.PERCENTAGE},shading:head?{type:ShadingType.CLEAR,fill:'DBEAFE'}:undefined,borders:{top:border,bottom:border,left:border,right:border},children:[new Paragraph({children:inlineRuns(value,TextRun),spacing:{after:60}})]}))}); children.push(new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:[makeRow(header,true),...rows.map(row=>makeRow(row))]})); };
      for (let i=0; i<lines.length; i++) {
        const raw=lines[i], trimmed=raw.trim();
        if (/^```/.test(trimmed)) { inCode=!inCode; continue; }
        if (!inCode && trimmed.includes('|') && i+1 < lines.length && isSeparator(lines[i+1])) { const header=tableCells(raw), rows=[]; i+=2; while (i<lines.length && lines[i].trim().includes('|') && !/^\s*$/.test(lines[i])) { rows.push(tableCells(lines[i])); i++; } i--; pushTable(header,rows); continue; }
        if (!trimmed) { children.push(new Paragraph({text:'',spacing:{after:80}})); continue; }
        const heading=trimmed.match(/^(#{1,6})\s+(.+)$/); if (heading) { const levels=[HeadingLevel.HEADING_1,HeadingLevel.HEADING_2,HeadingLevel.HEADING_3,HeadingLevel.HEADING_4,HeadingLevel.HEADING_5,HeadingLevel.HEADING_6]; children.push(new Paragraph({children:inlineRuns(heading[2],TextRun),heading:levels[heading[1].length-1],keepNext:true,spacing:{before:240,after:120}})); continue; }
        if (/^([-*_])\1\1+$/.test(trimmed)) { children.push(new Paragraph({thematicBreak:true})); continue; }
        const bullet=raw.match(/^(\s*)[-+*]\s+(.*)$/); if (bullet) { children.push(new Paragraph({children:inlineRuns(bullet[2],TextRun),bullet:{level:Math.min(5,Math.floor(bullet[1].replace(/\t/g,'  ').length/2))},spacing:{after:80}})); continue; }
        const numbered=raw.match(/^(\s*)\d+[.)]\s+(.*)$/); if (numbered) { const level=Math.min(5,Math.floor(numbered[1].replace(/\t/g,'  ').length/2)); children.push(new Paragraph({children:inlineRuns(numbered[2],TextRun),numbering:{reference:'minutes-numbering',level},spacing:{after:80}})); continue; }
        const quote=trimmed.match(/^>\s?(.*)$/); if (quote) { children.push(new Paragraph({children:inlineRuns(quote[1],TextRun),indent:{left:420},border:{left:{style:BorderStyle.SINGLE,size:12,color:'93C5FD',space:8}},spacing:{after:100}})); continue; }
        children.push(new Paragraph({children:inCode?[new TextRun({text:raw,font:'Consolas',size:18})]:inlineRuns(trimmed,TextRun),spacing:{after:120,line:340}}));
      }
      const documentFile = new Document({creator:'AI議事録ツール',title:'AI議事録',styles:{default:{document:{run:{font:'Yu Gothic',size:22},paragraph:{spacing:{line:340,after:120}}}}},numbering:{config:[{reference:'minutes-numbering',levels:Array.from({length:6},(_,level)=>({level,format:'decimal',text:`%${level+1}.`,alignment:'start',style:{paragraph:{indent:{left:360*(level+1),hanging:240}}}}))}]},sections:[{properties:{page:{margin:{top:1134,right:1134,bottom:1134,left:1134}}},children}]});
      return Packer.toBlob(documentFile);
    }
    function preparedDocx(markdown) { if (cachedDocxSource === markdown && cachedDocxBlob) return Promise.resolve(cachedDocxBlob); if (cachedDocxSource === markdown && cachedDocxPromise) return cachedDocxPromise; cachedDocxSource=markdown; cachedDocxPromise=createDocx(markdown).then(blob => { if (cachedDocxSource===markdown) cachedDocxBlob=blob; return blob; }).catch(error => { if (cachedDocxSource===markdown) invalidateDocxCache(); throw error; }); return cachedDocxPromise; }
    $('exportDocxBtn').addEventListener('click', async () => { if (!currentFullSummary.trim()) return notify('出力する議事録がありません。', true); try { const blob=await preparedDocx(currentFullSummary); if (!blob || blob.size < 1000) throw new Error('生成されたWordファイルが空です。'); await saveBlob(blob,'.docx','application/vnd.openxmlformats-officedocument.wordprocessingml.document'); notify('Wordファイルを出力しました。'); } catch (error) { console.error(error); notify(`Word出力に失敗しました: ${error.message}`, true); } });

    $('resetBtn').addEventListener('click', () => { if (!confirm('現在の文字起こしと議事録を消去しますか？')) return; currentFullTranscript=''; processCounter=0; setSummary(''); el.transcript.innerHTML='<p id="transcriptPlaceholder" class="mt-12 text-center text-sm italic text-slate-400">録音または音声ファイルの解析を開始すると、ここに文字起こしが追加されます。</p>'; el.transcriptPlaceholder=$('transcriptPlaceholder'); el.count.textContent='0回更新'; closeSettings(); notify('議事録データをリセットしました。'); });
  })();
  </script>
