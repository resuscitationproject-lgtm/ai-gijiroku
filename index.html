<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- iPhoneでアプリのように表示するためのメタタグ -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI議事録">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <title>北九州ITクラブ 音声解析リアルタイム議事録</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#1432AA', light: '#F0F4FF', dark: '#0A1D6B' }
                    },
                    typography: (theme) => ({
                        DEFAULT: {
                            css: {
                                h1: { color: theme('colors.brand.dark'), borderBottom: '2px solid', borderColor: theme('colors.brand.light'), paddingBottom: '0.5rem', fontSize: '24px', lineHeight: '1.3' },
                                h2: { color: theme('colors.brand.dark'), borderBottom: '2px solid', borderColor: theme('colors.gray.200'), paddingBottom: '0.5rem', marginTop: '1.5rem', fontSize: '18px', lineHeight: '1.4' },
                                h3: { color: theme('colors.brand.DEFAULT'), marginTop: '1.2rem', fontSize: '16px', lineHeight: '1.5' },
                                strong: { color: theme('colors.gray.900'), backgroundColor: theme('colors.brand.light'), padding: '0.1rem 0.3rem', borderRadius: '0.25rem' },
                                'ul > li::marker': { color: theme('colors.brand.DEFAULT') },
                                'ol > li::marker': { color: theme('colors.brand.DEFAULT'), fontWeight: 'bold' },
                                p: { fontSize: '14px' }, li: { fontSize: '14px' }
                            }
                        }
                    })
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        body { -webkit-tap-highlight-color: transparent; }
        
        .recording-pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* スマホ用タブ切り替えのスタイル */
        .tab-active { border-bottom: 2px solid #1432AA; color: #1432AA; font-weight: bold; }
        .tab-inactive { color: #6B7280; }
        
        @media (max-width: 1023px) {
            .mobile-hidden { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col pt-safe">

    <!-- ヘッダー (スマホ・PC対応) -->
    <header class="bg-white shadow-sm border-b border-gray-200 py-3 px-4 flex justify-between items-center sticky top-0 z-20">
        <div class="flex items-center gap-2">
            <div class="bg-brand text-white p-1.5 rounded-lg shadow-sm">
                <i data-lucide="mic-2" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-bold text-gray-900 leading-tight">AI議事録ツール</h1>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <!-- 手動送信ボタン (録音中のみ表示される) -->
            <button id="forceProcessBtn" title="今すぐ解析" class="hidden items-center justify-center bg-yellow-100 text-yellow-700 p-2 rounded-lg hover:bg-yellow-200 transition-colors border border-yellow-300 shadow-sm">
                <i data-lucide="zap" class="w-5 h-5"></i>
            </button>

            <!-- ファイル読込 -->
            <label id="uploadLabelWrapper" class="cursor-pointer flex items-center justify-center bg-gray-100 text-gray-700 p-2 rounded-lg hover:bg-gray-200 transition-colors border border-gray-200 shadow-sm">
                <i data-lucide="upload" class="w-5 h-5"></i>
                <input type="file" id="audioFileInput" accept="audio/*" class="hidden">
            </label>

            <!-- 設定ボタン -->
            <button id="settingsBtn" title="設定" class="flex items-center justify-center bg-gray-100 text-gray-700 p-2 rounded-lg hover:bg-gray-200 transition-colors border border-gray-200 shadow-sm">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>

            <!-- 録音ボタン -->
            <button id="recordBtn" class="flex items-center gap-1.5 bg-brand text-white px-3 sm:px-4 py-2 rounded-lg font-bold shadow-sm transition-colors">
                <i data-lucide="play" class="w-4 h-4" id="recordIcon"></i>
                <span id="recordText">開始</span>
            </button>
        </div>
    </header>

    <!-- プログレスバー -->
    <div id="progressContainer" class="w-full bg-gray-200 h-1 hidden">
        <div id="progressBar" class="bg-brand h-1 transition-all duration-1000 ease-linear" style="width: 0%"></div>
    </div>

    <!-- スマホ用タブ切り替え -->
    <div class="flex lg:hidden bg-white border-b border-gray-200 sticky z-10" style="top: 60px;">
        <button id="tabTranscript" class="flex-1 py-3 text-sm tab-active flex items-center justify-center gap-2">
            <i data-lucide="users" class="w-4 h-4"></i> 文字起こし
        </button>
        <button id="tabSummary" class="flex-1 py-3 text-sm tab-inactive flex items-center justify-center gap-2">
            <i data-lucide="file-text" class="w-4 h-4"></i> 議事録
        </button>
    </div>

    <!-- メインコンテンツ -->
    <main class="flex-1 w-full mx-auto p-2 sm:p-4 lg:p-6 flex flex-col lg:flex-row gap-4 lg:gap-6 h-[calc(100vh-140px)] max-w-screen-2xl">
        
        <!-- 左側：文字起こし履歴 -->
        <div id="panelTranscript" class="flex-1 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden h-full">
            <div class="bg-white px-3 sm:px-4 py-2 sm:py-3 border-b border-gray-200 flex justify-between items-center">
                <h2 class="font-semibold text-gray-700 flex items-center gap-2 text-sm sm:text-base hidden lg:flex">
                    <i data-lucide="users" class="w-4 h-4 text-gray-500"></i> 文字起こし (履歴)
                </h2>
                <div class="flex items-center gap-2 w-full lg:w-auto justify-between lg:justify-end">
                    <span id="statusIndicator" class="text-[10px] sm:text-xs font-medium bg-gray-100 text-gray-600 px-2 py-1 rounded-full whitespace-nowrap">待機中</span>
                    <button id="copyTranscriptBtn" class="flex items-center gap-1 text-[10px] sm:text-xs font-bold bg-white border border-gray-300 text-gray-600 px-2 sm:px-3 py-1 sm:py-1.5 rounded hover:bg-gray-100 shadow-sm">
                        <i data-lucide="copy" class="w-3 h-3"></i> コピー
                    </button>
                </div>
            </div>
            <div id="transcriptArea" class="flex-1 p-3 sm:p-4 overflow-y-auto space-y-3 sm:space-y-4 bg-gray-50/50">
                <p class="text-gray-400 italic text-xs sm:text-sm text-center mt-10" id="transcriptPlaceholder">
                    録音を開始すると、ここに文字起こしが追加されます。
                </p>
            </div>
        </div>

        <!-- 右側：全体議事録 -->
        <div id="panelSummary" class="flex-1 bg-white rounded-xl shadow-sm border border-brand/20 flex flex-col overflow-hidden h-full mobile-hidden">
            <div class="bg-brand-light px-3 sm:px-4 py-2 sm:py-3 border-b border-brand/20 flex justify-between items-center">
                <h2 class="font-semibold text-brand-dark flex items-center gap-2 text-sm sm:text-base hidden lg:flex">
                    <i data-lucide="file-text" class="w-4 h-4 text-brand"></i> 最新の全体議事録
                </h2>
                <div class="flex items-center gap-2 w-full lg:w-auto justify-between lg:justify-end">
                    <span id="processCount" class="text-[10px] sm:text-xs font-medium text-brand bg-brand/10 px-2 py-1 rounded">0回更新</span>
                    <div class="flex gap-1.5">
                        <button id="exportDocBtn" class="flex items-center gap-1 text-[10px] sm:text-xs font-bold bg-white border border-brand/30 text-brand px-2 sm:px-3 py-1 sm:py-1.5 rounded hover:bg-brand hover:text-white shadow-sm">
                            <i data-lucide="share" class="w-3 h-3"></i> <span class="hidden sm:inline">ドキュメント出力</span><span class="sm:hidden">出力・共有</span>
                        </button>
                        <button id="copySummaryBtn" class="flex items-center gap-1 text-[10px] sm:text-xs font-bold bg-white border border-brand/30 text-brand px-2 sm:px-3 py-1 sm:py-1.5 rounded hover:bg-brand hover:text-white shadow-sm">
                            <i data-lucide="copy" class="w-3 h-3"></i> コピー
                        </button>
                    </div>
                </div>
            </div>
            <div id="summaryArea" class="flex-1 p-3 sm:p-5 overflow-y-auto bg-white">
                <div id="summaryContent" class="prose max-w-none text-gray-800">
                    <p class="text-gray-400 italic text-xs sm:text-sm text-center mt-10" id="summaryPlaceholder">
                        音声の解析が進むと、最新の議事録がここに生成されます。
                    </p>
                </div>
            </div>
            
            <div id="loadingToast" class="absolute bottom-4 right-4 bg-gray-900 text-white px-3 py-2 rounded-lg shadow-lg flex items-center gap-2 transition-opacity opacity-0 pointer-events-none z-10 text-sm">
                <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-brand-light"></i>
                <span>議事録を更新中...</span>
            </div>
        </div>
    </main>

    <!-- 設定モーダル -->
    <div id="settingsModal" class="fixed inset-0 bg-gray-900/50 hidden flex items-center justify-center z-50 p-4 transition-opacity opacity-0 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto transform scale-95 transition-transform duration-200">
            <div class="flex justify-between items-center p-4 border-b border-gray-100 sticky top-0 bg-white/90 backdrop-blur">
                <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2"><i data-lucide="settings" class="w-5 h-5 text-gray-500"></i> 設定</h3>
                <button id="closeSettingsBtn" class="p-1 hover:bg-gray-100 rounded-full"><i data-lucide="x" class="w-5 h-5 text-gray-500"></i></button>
            </div>
            
            <div class="p-5 space-y-5">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Gemini APIキー <span class="text-red-500">*</span></label>
                    <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-brand focus:border-brand shadow-inner">
                </div>

                <div class="bg-brand-light/50 p-3 rounded-lg border border-brand/10 space-y-3">
                    <div>
                        <label class="block text-sm font-bold text-brand-dark mb-1">会議のテーマ・目的</label>
                        <input type="text" id="themeInput" placeholder="例: 新アプリ開発のキックオフ" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-brand focus:border-brand">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-brand-dark mb-1">参加者名 (カンマ区切り)</label>
                        <input type="text" id="participantsInput" placeholder="例: 山田, 佐藤, 鈴木" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-brand focus:border-brand">
                        <p class="text-[10px] text-gray-500 mt-1">※事前に入力するとAIの文字起こしや要約の精度が向上します。</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">録音モード</label>
                        <select id="modeSelect" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
                            <option value="mic">対面会議 (マイク)</option>
                            <option value="mix">オンライン会議</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">解析周期</label>
                        <select id="intervalSelect" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
                            <option value="60">1分</option>
                            <option value="300" selected>5分 (推奨)</option>
                            <option value="600">10分</option>
                        </select>
                    </div>
                </div>

                <hr class="border-gray-100">

                <div>
                    <button id="modalResetBtn" class="w-full flex justify-center items-center gap-2 py-2.5 border border-red-200 text-red-600 bg-red-50 rounded-lg hover:bg-red-100 transition-colors text-sm font-bold shadow-sm">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> これまでのデータを消去してリセット
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 通知アラート領域 -->
    <div id="toastContainer" class="fixed top-safe mt-4 left-1/2 transform -translate-x-1/2 z-[60] w-full max-w-sm px-4 pointer-events-none flex flex-col gap-2"></div>

    <footer class="bg-white border-t border-gray-200 py-3 text-center shrink-0">
        <p class="text-xs text-gray-400 font-medium tracking-wider">作成元：光井企画工学事務所　バージョン 2.00SP</p>
    </footer>

    <script>
        // --- 状態管理 ---
        let isRecording = false;
        let isProcessingFile = false;
        let stream = null; 
        let micStream = null;
        let sysStream = null;
        let audioCtx = null;

        let chunkTimer = null;
        let progressInterval = null;
        let startTime = 0;
        let currentIntervalSeconds = 300; 
        let processCounter = 0;
        let supportedMimeType = '';
        
        let currentFullSummary = ""; 
        let currentFullTranscript = ""; 

        // --- DOM要素 ---
        const recordBtn = document.getElementById('recordBtn');
        const recordIcon = document.getElementById('recordIcon');
        const recordText = document.getElementById('recordText');
        const forceProcessBtn = document.getElementById('forceProcessBtn'); 
        const uploadLabelWrapper = document.getElementById('uploadLabelWrapper');
        const audioFileInput = document.getElementById('audioFileInput');
        
        const panelTranscript = document.getElementById('panelTranscript');
        const panelSummary = document.getElementById('panelSummary');
        const tabTranscript = document.getElementById('tabTranscript');
        const tabSummary = document.getElementById('tabSummary');
        
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const themeInput = document.getElementById('themeInput');
        const participantsInput = document.getElementById('participantsInput');
        const modeSelect = document.getElementById('modeSelect');
        const intervalSelect = document.getElementById('intervalSelect');
        const modalResetBtn = document.getElementById('modalResetBtn');
        
        const statusIndicator = document.getElementById('statusIndicator');
        const transcriptArea = document.getElementById('transcriptArea');
        const summaryContent = document.getElementById('summaryContent');
        const progressBar = document.getElementById('progressBar');
        const processCountSpan = document.getElementById('processCount');
        const loadingToast = document.getElementById('loadingToast');
        
        const exportDocBtn = document.getElementById('exportDocBtn'); 
        const copySummaryBtn = document.getElementById('copySummaryBtn');
        const copyTranscriptBtn = document.getElementById('copyTranscriptBtn');

        lucide.createIcons();

        // --- 初期設定とストレージ ---
        document.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key_kitakyushu');
            if (savedKey) apiKeyInput.value = savedKey;
            
            const savedTheme = localStorage.getItem('meeting_theme');
            if (savedTheme) themeInput.value = savedTheme;
            
            const savedParticipants = localStorage.getItem('meeting_participants');
            if (savedParticipants) participantsInput.value = savedParticipants;
        });

        apiKeyInput.addEventListener('input', (e) => localStorage.setItem('gemini_api_key_kitakyushu', e.target.value.trim()));
        themeInput.addEventListener('input', (e) => localStorage.setItem('meeting_theme', e.target.value.trim()));
        participantsInput.addEventListener('input', (e) => localStorage.setItem('meeting_participants', e.target.value.trim()));

        function getApiKey() {
            const key = apiKeyInput.value.trim();
            if (!key) {
                showNotification("設定(⚙️)からGemini APIキーを入力してください。", true);
                openSettingsModal();
                return null;
            }
            return key;
        }

        // --- UI制御 (タブ、モーダル) ---
        function switchTab(showPanel) {
            if (window.innerWidth >= 1024) return;
            if (showPanel === 'transcript') {
                panelTranscript.classList.remove('mobile-hidden');
                panelSummary.classList.add('mobile-hidden');
                tabTranscript.className = "flex-1 py-3 text-sm tab-active flex items-center justify-center gap-2 bg-white";
                tabSummary.className = "flex-1 py-3 text-sm tab-inactive flex items-center justify-center gap-2 bg-gray-50 border-b border-gray-200";
            } else {
                panelSummary.classList.remove('mobile-hidden');
                panelTranscript.classList.add('mobile-hidden');
                tabSummary.className = "flex-1 py-3 text-sm tab-active flex items-center justify-center gap-2 bg-white";
                tabTranscript.className = "flex-1 py-3 text-sm tab-inactive flex items-center justify-center gap-2 bg-gray-50 border-b border-gray-200";
            }
        }
        tabTranscript.addEventListener('click', () => switchTab('transcript'));
        tabSummary.addEventListener('click', () => switchTab('summary'));

        window.addEventListener('resize', () => {
            if (window.innerWidth >= 1024) {
                panelTranscript.classList.remove('mobile-hidden');
                panelSummary.classList.remove('mobile-hidden');
            } else {
                switchTab(tabTranscript.classList.contains('tab-active') ? 'transcript' : 'summary');
            }
        });

        function openSettingsModal() {
            settingsModal.classList.remove('hidden');
            requestAnimationFrame(() => {
                settingsModal.classList.remove('opacity-0');
                settingsModal.querySelector('div').classList.remove('scale-95');
            });
        }
        function closeSettingsModal() {
            settingsModal.classList.add('opacity-0');
            settingsModal.querySelector('div').classList.add('scale-95');
            setTimeout(() => settingsModal.classList.add('hidden'), 200);
        }
        settingsBtn.addEventListener('click', openSettingsModal);
        closeSettingsBtn.addEventListener('click', closeSettingsModal);

        // --- 通知機能 ---
        function showNotification(msg, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bgClass = isError ? 'bg-white border-l-4 border-red-500 shadow-lg text-gray-800' : 'bg-brand shadow-lg text-white';
            const iconHTML = isError ? '<i data-lucide="alert-triangle" class="w-5 h-5 text-red-500 shrink-0"></i>' : '<i data-lucide="check-circle-2" class="w-5 h-5 shrink-0"></i>';
            const duration = isError ? 10000 : 4000; 

            toast.className = `p-4 rounded-lg flex items-start gap-3 transition-all duration-300 transform -translate-y-4 opacity-0 ${bgClass}`;
            toast.innerHTML = `${iconHTML} <div class="text-sm font-medium leading-snug">${msg.replace(/\n/g, '<br>')}</div>`;
            
            container.appendChild(toast);
            lucide.createIcons({ root: toast });
            
            requestAnimationFrame(() => toast.classList.remove('-translate-y-4', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('-translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, duration); 
        }

        function getSupportedMimeType() {
            const types = ['audio/webm', 'audio/mp4', 'audio/ogg'];
            for (let t of types) { if (MediaRecorder.isTypeSupported(t)) return t; }
            return '';
        }

        // --- UI更新 ---
        function updateUIState(recording, isFile = false) {
            if (recording) {
                recordIcon.setAttribute('data-lucide', 'square');
                recordText.textContent = "停止";
                recordBtn.classList.remove('bg-brand');
                recordBtn.classList.add('bg-red-500', 'recording-pulse');
                
                forceProcessBtn.classList.remove('hidden'); 
                forceProcessBtn.classList.add('flex');

                statusIndicator.textContent = isFile ? `解析中` : `録音中`;
                statusIndicator.className = isFile ? "text-[10px] sm:text-xs font-medium bg-blue-50 text-brand px-2 py-1 rounded-full whitespace-nowrap animate-pulse border border-brand/20" : "text-[10px] sm:text-xs font-medium bg-red-50 text-red-600 px-2 py-1 rounded-full whitespace-nowrap animate-pulse border border-red-200";
                document.getElementById('progressContainer').classList.remove('hidden');

                uploadLabelWrapper.classList.add('pointer-events-none', 'opacity-50');
                settingsBtn.classList.add('pointer-events-none', 'opacity-50');
                apiKeyInput.disabled = true;
                
                const pColor = isFile ? "text-brand" : "text-red-500";
                const pText = isFile ? "音声ファイルを解析しています..." : "音声を記録・解析しています...";
                const transcriptPlaceholder = document.getElementById('transcriptPlaceholder');
                if (transcriptPlaceholder) transcriptPlaceholder.style.display = 'none';

                const existingLoading = document.getElementById('loadingPlaceholder');
                if (existingLoading) existingLoading.remove();
                
                transcriptArea.insertAdjacentHTML('beforeend', `
                    <div id="loadingPlaceholder" class="flex flex-col items-center justify-center w-full py-8 ${pColor} fade-in bg-white rounded-lg border border-gray-100 shadow-sm mt-2">
                        <i data-lucide="loader-2" class="w-8 h-8 animate-spin mb-3"></i>
                        <p class="text-sm font-bold">${pText}</p>
                        <p class="text-[10px] sm:text-xs text-gray-500 mt-2">※右上の稲妻(⚡)ボタンを押すと、即座に議事録を生成します。</p>
                    </div>
                `);
                transcriptArea.scrollTop = transcriptArea.scrollHeight;

            } else {
                recordIcon.setAttribute('data-lucide', 'play');
                recordText.textContent = "開始";
                recordBtn.classList.add('bg-brand');
                recordBtn.classList.remove('bg-red-500', 'recording-pulse');
                
                forceProcessBtn.classList.add('hidden');
                forceProcessBtn.classList.remove('flex');

                statusIndicator.textContent = "待機中";
                statusIndicator.className = "text-[10px] sm:text-xs font-medium bg-gray-100 text-gray-600 px-2 py-1 rounded-full whitespace-nowrap border border-gray-200";
                document.getElementById('progressContainer').classList.add('hidden');

                uploadLabelWrapper.classList.remove('pointer-events-none', 'opacity-50');
                settingsBtn.classList.remove('pointer-events-none', 'opacity-50');
                apiKeyInput.disabled = false;

                const loadingPlaceholder = document.getElementById('loadingPlaceholder');
                if (loadingPlaceholder) loadingPlaceholder.remove();

                const transcriptPlaceholder = document.getElementById('transcriptPlaceholder');
                const hasHistory = transcriptArea.querySelector('div.bg-white, div.bg-red-50');
                if (!hasHistory && transcriptPlaceholder) transcriptPlaceholder.style.display = 'block';
            }
            lucide.createIcons();
        }

        // --- スマホ向けワンクリック共有/出力 (Web Share API) ---
        exportDocBtn.addEventListener('click', async () => {
            const el = document.getElementById('summaryContent');
            if (!el || currentFullSummary.trim() === "") { showNotification("出力する議事録がありません。", true); return; }

            const contentHTML = el.innerHTML;
            const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>議事録</title><style>body { font-family: 'Meiryo', 'MS Gothic', sans-serif; font-size: 14px; } h1 { color: #1432AA; border-bottom: 2px solid #F0F4FF; padding-bottom: 0.5rem; font-size: 24px; } h2 { color: #1432AA; border-bottom: 2px solid #E5E7EB; padding-bottom: 0.5rem; margin-top: 1.5rem; font-size: 18px; } h3 { color: #1432AA; margin-top: 1.2rem; font-size: 16px; } strong { background-color: #F0F4FF; }</style></head><body>`;
            const footer = "</body></html>";
            const sourceHTML = header + contentHTML + footer;
            
            const blob = new Blob(['\ufeff', sourceHTML], { type: 'application/msword' });
            const fileName = '議事録_' + new Date().toLocaleDateString('ja-JP').replace(/\//g, '') + '.doc';
            const file = new File([blob], fileName, { type: 'application/msword' });

            try {
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'AI議事録',
                        text: '作成された議事録ドキュメントです。'
                    });
                    showNotification("ドキュメントを共有・保存しました。");
                } 
                else if (window.showSaveFilePicker) {
                    const handle = await window.showSaveFilePicker({ suggestedName: fileName, types: [{ description: 'Word互換ファイル', accept: {'application/msword': ['.doc']} }] });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    showNotification("ドキュメントを保存しました。");
                } 
                else {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = fileName;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                    showNotification("ドキュメントをダウンロードしました。");
                }

                const originalHTML = exportDocBtn.innerHTML;
                exportDocBtn.innerHTML = '<i data-lucide="check" class="w-3 h-3"></i> <span class="hidden sm:inline">完了</span><span class="sm:hidden">完了</span>';
                exportDocBtn.className = exportDocBtn.className.replace("text-brand border-brand/30 hover:bg-brand hover:text-white", "text-green-600 border-green-600/30 bg-green-50");
                lucide.createIcons();
                setTimeout(() => {
                    exportDocBtn.innerHTML = originalHTML;
                    exportDocBtn.className = exportDocBtn.className.replace("text-green-600 border-green-600/30 bg-green-50", "text-brand border-brand/30 hover:bg-brand hover:text-white");
                    lucide.createIcons();
                }, 2000);
            } catch (err) { 
                if (err.name !== 'AbortError') showNotification("出力に失敗しました。", true); 
            }
        });

        // コピー機能
        function copyToClipboard(text, successMsg) {
            if (!text || text.trim() === "") { showNotification("コピーするデータがありません。", true); return; }
            const textarea = document.createElement('textarea');
            textarea.value = text; textarea.style.position = 'fixed'; textarea.style.opacity = '0';
            document.body.appendChild(textarea); textarea.select();
            try {
                if (document.execCommand('copy')) showNotification(successMsg);
                else throw new Error("Failed");
            } catch (err) { showNotification("コピーに失敗しました。", true); } 
            finally { document.body.removeChild(textarea); }
        }

        function copyRichText(elementId, successMsg) {
            const el = document.getElementById(elementId);
            if (!el || currentFullSummary.trim() === "") { showNotification("コピーする議事録がありません。", true); return; }
            const selection = window.getSelection(); const range = document.createRange();
            range.selectNodeContents(el); selection.removeAllRanges(); selection.addRange(range);
            try {
                if (document.execCommand('copy')) {
                    selection.removeAllRanges();
                    showNotification(successMsg);
                } else throw new Error("Failed");
            } catch (err) { showNotification("コピーに失敗しました。", true); }
        }

        copySummaryBtn.addEventListener('click', () => copyRichText('summaryContent', "議事録をクリップボードにコピーしました！"));
        copyTranscriptBtn.addEventListener('click', () => copyToClipboard(currentFullTranscript, "文字起こしデータをコピーしました！"));

        // --- データリセット (モーダル内) ---
        modalResetBtn.addEventListener('click', () => {
            if (isRecording || isProcessingFile) { showNotification("処理中はリセットできません。", true); closeSettingsModal(); return; }
            if (confirm("これまでの文字起こしと議事録データがすべて消去されます。よろしいですか？")) {
                processCounter = 0; currentFullSummary = ""; currentFullTranscript = ""; processCountSpan.textContent = `0回更新`;
                transcriptArea.innerHTML = `<p class="text-gray-400 italic text-xs sm:text-sm text-center mt-10" id="transcriptPlaceholder">録音を開始すると、ここに文字起こしが追加されます。</p>`;
                summaryContent.innerHTML = `<p class="text-gray-400 italic text-xs sm:text-sm text-center mt-10" id="summaryPlaceholder">音声の解析が進むと、最新の議事録がここに生成されます。</p>`;
                closeSettingsModal();
                showNotification("データをリセットしました。");
            }
        });

        // --- 録音・システム音ミックス処理 ---
        let currentRecorder = null; 

        async function startRecording() {
            const currentApiKey = getApiKey();
            if (!currentApiKey) return;

            const mode = modeSelect.value;
            supportedMimeType = getSupportedMimeType();
            
            if (!supportedMimeType) { showNotification("ブラウザが音声録音に非対応です。", true); return; }

            try {
                if (mode === 'mix') {
                    if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream) {
                        showNotification("【iPhone・iPadではオンライン会議モードを利用できません】\n対面会議モードに切り替えてご利用ください。", true);
                        openSettingsModal();
                        return;
                    }
                    showNotification("【重要】画面共有ポップアップが出たら、必ず「タブの音声を共有」または「システムオーディオも共有」にチェックを入れてください。");
                    
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    sysStream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: "browser" }, audio: true });
                    if (sysStream.getAudioTracks().length === 0) throw new Error("NO_AUDIO_TRACK");

                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const dest = audioCtx.createMediaStreamDestination();
                    audioCtx.createMediaStreamSource(micStream).connect(dest);
                    audioCtx.createMediaStreamSource(sysStream).connect(dest);
                    stream = dest.stream;
                    sysStream.getVideoTracks()[0].onended = () => { if(isRecording) stopRecording(); };
                } else {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    stream = micStream;
                }

                isRecording = true;
                currentIntervalSeconds = parseInt(intervalSelect.value, 10);
                updateUIState(true, false);
                recordingLoop(currentApiKey);

            } catch (err) {
                cleanupStreams(); 
                if (err.message === "NO_AUDIO_TRACK") showNotification("PCの音声が取得できませんでした。\n必ず「システム音声も共有」にチェックを入れてください。", true);
                else if (err.name === 'NotAllowedError') showNotification("アクセスが拒否されました。\nマイクの許可が必要です。", true);
                else showNotification("録音の開始に失敗しました。", true);
            }
        }

        function cleanupStreams() {
            if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
            if (sysStream) { sysStream.getTracks().forEach(t => t.stop()); sysStream = null; }
            if (audioCtx) { audioCtx.close(); audioCtx = null; }
            stream = null;
        }

        function stopRecording() {
            isRecording = false;
            if (chunkTimer) clearTimeout(chunkTimer);
            if (progressInterval) clearInterval(progressInterval);
            if (currentRecorder && currentRecorder.state !== 'inactive') {
                currentRecorder.stop(); 
            } else {
                cleanupStreams(); 
                updateUIState(false);
            }
        }

        forceProcessBtn.addEventListener('click', () => {
            if (!isRecording || !currentRecorder) return;
            if (chunkTimer) clearTimeout(chunkTimer);
            if (currentRecorder.state !== 'inactive') {
                showNotification("現在の録音データを解析に回しています...");
                currentRecorder.stop(); 
            }
        });

        async function recordingLoop(apiKey) {
            while (isRecording) {
                await recordAndProcessChunk(apiKey);
            }
            cleanupStreams();
            updateUIState(false);
            progressBar.style.width = '0%';
        }

        function recordAndProcessChunk(apiKey) {
            return new Promise((resolve) => {
                if (!isRecording) { resolve(); return; }

                const options = supportedMimeType ? { mimeType: supportedMimeType } : {};
                try { currentRecorder = new MediaRecorder(stream, options); } 
                catch(e) { currentRecorder = new MediaRecorder(stream); }
                
                const chunks = [];
                currentRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };

                currentRecorder.onstop = async () => {
                    const audioType = supportedMimeType || 'audio/webm';
                    const audioBlob = new Blob(chunks, { type: audioType });
                    const chunkIndex = processCounter + 1;
                    
                    resolve(); 

                    if (audioBlob.size > 0 && (isRecording || chunks.length > 0)) {
                        processCounter++;
                        processCountSpan.textContent = `${processCounter}回更新`;
                        await processAudioWithGemini(audioBlob, chunkIndex, audioType, apiKey);
                    }
                };

                currentRecorder.start();
                
                startTime = Date.now();
                if (progressInterval) clearInterval(progressInterval);
                progressInterval = setInterval(() => {
                    const elapsed = (Date.now() - startTime) / 1000;
                    const percent = Math.min((elapsed / currentIntervalSeconds) * 100, 100);
                    progressBar.style.width = `${percent}%`;
                }, 100);

                chunkTimer = setTimeout(() => {
                    if (currentRecorder.state !== 'inactive') {
                        currentRecorder.stop();
                    }
                }, currentIntervalSeconds * 1000);
            });
        }

        // --- ファイルアップロード処理 ---
        audioFileInput.addEventListener('change', async (e) => {
            if (isRecording || isProcessingFile) { showNotification("現在処理中です。", true); audioFileInput.value = ''; return; }
            const currentApiKey = getApiKey(); if (!currentApiKey) { audioFileInput.value = ''; return; }
            const file = e.target.files[0]; if (!file) return;

            if (file.size > 50 * 1024 * 1024) { showNotification('ファイルサイズが大きすぎます（上限50MB）。', true); audioFileInput.value = ''; return; }

            isProcessingFile = true; updateUIState(true, true);
            
            try {
                const chunkIndex = processCounter + 1;
                await processAudioWithGemini(file, chunkIndex, file.type || 'audio/mpeg', currentApiKey);
                processCounter++; processCountSpan.textContent = `${processCounter}回更新`;
                showNotification("音声ファイルの解析が完了しました。");
            } catch (error) {
                console.error("[File] Processing error:", error);
            } finally {
                isProcessingFile = false; audioFileInput.value = ''; updateUIState(false);
            }
        });

        // --- Gemini API連携 ---
        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject; reader.readAsDataURL(blob);
            });
        }

        async function fetchWithRetry(url, options, maxRetries = 3) {
            const delays = [2000, 4000, 6000];
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        const errText = await response.text();
                        let errorJson = {};
                        try { errorJson = JSON.parse(errText); } catch(e){}
                        
                        if (response.status === 429 || (errorJson.error && errorJson.error.status === "RESOURCE_EXHAUSTED")) {
                            throw new Error("【API制限エラー (429)】\nGoogle AI Studioの予算上限に達したか、通信頻度が高すぎます。\n設定を確認するか、数分待って再度お試しください。");
                        } else if (response.status === 400 && errText.includes("API key not valid")) {
                            throw new Error("【認証エラー (400)】\nAPIキーが間違っているか、無効です。\n設定(⚙️)から正しいAPIキーを入力し直してください。");
                        } else if (response.status === 403) {
                            throw new Error("【権限エラー (403)】\nこのAPIキーには必要な権限がないか、利用が制限されています。");
                        }
                        throw new Error(`エラー (${response.status}): ${errorJson.error?.message || '不明なエラー'}`);
                    }
                    return await response.json();
                } catch (error) {
                    if (i === maxRetries - 1) throw error; 
                    if (error.message.includes("API制限") || error.message.includes("認証エラー")) throw error; 
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        }

        async function processAudioWithGemini(blob, chunkIndex, audioType, apiKey) {
            loadingToast.classList.remove('opacity-0');
            const pTheme = themeInput.value.trim();
            const pUsers = participantsInput.value.trim();
            
            let contextStr = "";
            if (pTheme) contextStr += `\n【会議のテーマ】\n${pTheme}\n`;
            if (pUsers) contextStr += `\n【主な参加者】\n${pUsers}\n`;

            try {
                const base64Audio = await blobToBase64(blob);
                const cleanMimeType = audioType.split(';')[0]; 

                const prompt = `あなたは優秀な議事録作成アシスタントです。
これまで作成された「現在の全体議事録」と、「新しく録音された音声セグメント」が提供されます。
${contextStr}
【指示】
1. 文字起こし: 今回の音声セグメントを正確に文字起こししてください。文脈や【主な参加者】の情報を活用して話者を識別し「話者A: 〇〇」のように明記してください。
2. 議事録の更新: 【現在の全体議事録】の内容をベースに、今回の音声の内容を追加・統合して、最新の「1つの統合された議事録」を作成してください。
   - **詳細な記録**: 過度な要約は避け、議論のプロセスや懸念点を具体的に残すこと。
   - **構造化**: 必ずMarkdownの階層構造（「会議の目的」「議論の詳細」「決定事項」「今後のToDo」など）を維持し、最後まで出力しきること（途中でフォーマットを崩さない）。

【現在の全体議事録】
${currentFullSummary || "まだ議事録はありません。今回の音声から議事録の作成を開始してください。"}
`;

                const payload = {
                    contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: cleanMimeType, data: base64Audio } }] }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        maxOutputTokens: 8192, 
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                transcript: { type: "STRING", description: "話者名を含めた文字起こし" },
                                summary: { type: "STRING", description: "統合・更新された最新の全体議事録(Markdown形式)" }
                            },
                            required: ["transcript", "summary"]
                        }
                    }
                };

                const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const data = await fetchWithRetry(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let jsonText = data.candidates[0].content.parts[0].text.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                    const result = JSON.parse(jsonText);
                    
                    if (result.summary && !result.summary.includes("エラーにより")) currentFullSummary = result.summary;
                    appendResults(result.transcript, result.summary, chunkIndex);
                }
            } catch (error) {
                console.error(`Gemini API Error (Chunk #${chunkIndex}):`, error);
                showNotification(error.message, true); 
                appendResults(`*(処理失敗)*\n${error.message}`, null, chunkIndex, true);
            } finally { loadingToast.classList.add('opacity-0'); }
        }

        function appendResults(transcript, summary, chunkIndex, isError = false) {
            const loadingPlaceholder = document.getElementById('loadingPlaceholder');
            if (loadingPlaceholder) loadingPlaceholder.remove();
            
            const timeStr = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
            const bgColor = isError ? 'bg-red-50 border-red-200' : 'bg-white border-gray-200';
            
            if (!isError && transcript) { currentFullTranscript += `[${timeStr} - パート${chunkIndex}]\n${transcript}\n\n`; }
            const formattedTranscript = transcript.replace(/^(話者[A-Z]+|Speaker\s*[A-Z]+|男性|女性|参加者[0-9]*)\s*:/gim, '<strong class="text-brand">$1:</strong>');

            const transcriptHtml = `
                <div class="${bgColor} p-3 sm:p-4 rounded-lg border shadow-sm fade-in mb-3">
                    <div class="flex items-center gap-2 mb-2 pb-2 border-b border-gray-100">
                        <span class="bg-gray-100 text-gray-500 text-[10px] sm:text-xs px-2 py-0.5 rounded border border-gray-200">#${chunkIndex}</span>
                        <span class="text-[10px] sm:text-xs text-gray-400"><i data-lucide="clock" class="w-3 h-3 inline mr-1"></i>${timeStr} 完了</span>
                    </div>
                    <div class="text-xs sm:text-sm text-gray-700 whitespace-pre-wrap leading-relaxed">${formattedTranscript}</div>
                </div>
            `;
            transcriptArea.insertAdjacentHTML('beforeend', transcriptHtml);
            transcriptArea.scrollTop = transcriptArea.scrollHeight;

            if (!isError && summary) { 
                summaryContent.innerHTML = marked.parse(summary); 
                if (window.innerWidth < 1024 && document.getElementById('tabTranscript').classList.contains('tab-active')) {
                    switchTab('summary');
                }
            }
            lucide.createIcons();
        }

        recordBtn.addEventListener('click', () => {
            if (isProcessingFile) { showNotification("ファイル解析中は中断できません。", true); return; }
            if (isRecording) stopRecording(); else startRecording();
        });

    </script>
</body>
